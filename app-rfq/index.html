<style>
/* Layout: una columna tipo app de estación (máx. 560px), barra de rol arriba, pestañas por rol, tarjetas por renglón */
:root{
  --bg:#f2f4f6;--panel:#ffffff;--line:#d8dfe5;--tx:#14202a;--tx2:#4f5e69;--tx3:#7d8c97;
  --ac:#1f5fa8;--ac-s:#e2ecf8;--ok:#1a7f37;--ok-s:#e2f3e6;--bad:#b42318;--bad-s:#fcebea;
  --warn:#946200;--warn-s:#fbf1d9;--vio:#6b3fa0;--vio-s:#efe7f8;--logo:#ffffff;
  --f:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151a;--panel:#18212899;--line:#2b3842;--tx:#e6edf2;--tx2:#a5b3bd;--tx3:#7a8a95;
  --ac:#6aa7ec;--ac-s:#1b2d42;--ok:#5cc27a;--ok-s:#173022;--bad:#f0837a;--bad-s:#3a1c1a;
  --warn:#e5b54a;--warn-s:#3a2e12;--vio:#b897e3;--vio-s:#2c2140;--logo:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151a;--panel:#18212899;--line:#2b3842;--tx:#e6edf2;--tx2:#a5b3bd;--tx3:#7a8a95;
  --ac:#6aa7ec;--ac-s:#1b2d42;--ok:#5cc27a;--ok-s:#173022;--bad:#f0837a;--bad-s:#3a1c1a;
  --warn:#e5b54a;--warn-s:#3a2e12;--vio:#b897e3;--vio-s:#2c2140;--logo:#ffffff;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:var(--f);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.logos{display:flex;align-items:center;gap:8px;background:var(--logo);border:1px solid var(--line);border-radius:12px;padding:6px 10px;flex:none}

.hdr h1{font-size:20px;margin:0;line-height:1.1}

.proto{font-size:12px;color:var(--warn);background:var(--warn-s);border-radius:10px;padding:8px 10px;margin-bottom:10px;line-height:1.4}
.proto button{background:none;border:0;color:var(--ac);font-weight:700;padding:0;font-size:12px}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.roles button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 4px;font-size:14px;font-weight:700;color:var(--tx);line-height:1.2;position:relative;min-width:0}
.roles button small{display:block;font-size:11px;font-weight:600;color:var(--tx2)}
.roles button[aria-pressed="true"] small{color:#fff}
.roles button .bd{position:absolute;top:-6px;right:-4px;margin:0}
.roles button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
.roles span.l{grid-column:1/-1;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1 1 30%;border:0;background:none;border-radius:9px;padding:9px 4px;font-size:14px;font-weight:700;color:var(--tx2);position:relative}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 2px}
.sub{font-size:12px;color:var(--tx2);margin-bottom:10px;line-height:1.4}
.k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);font-weight:700}
label.f{display:block;font-size:13px;font-weight:700;color:var(--tx2);margin:10px 0 4px}
input[type=text],input[type=number],input[type=search],select{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input[type=number]{font-variant-numeric:tabular-nums}
.res{list-style:none;margin:6px 0 0;padding:0;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.res li{border-top:1px solid var(--line)}
.res li:first-child{border-top:0}
.res button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;align-items:flex-start}
.res .d{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.res .m{font-size:12px;color:var(--tx2);margin-top:2px}
.res .p{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.c-dir{background:var(--ok-s);color:var(--ok)}
.c-cot{background:var(--vio-s);color:var(--vio)}
.c-aut{background:var(--warn-s);color:var(--warn)}
.c-ped{background:var(--ac-s);color:var(--ac)}
.c-ok{background:var(--ok-s);color:var(--ok)}
.c-bad{background:var(--bad-s);color:var(--bad)}
.c-gr{background:var(--bg);color:var(--tx2);border:1px solid var(--line)}
.ln{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.ln:first-of-type{border-top:0}
.ln .a{flex:1;min-width:0}
.ln .a b{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.ln .a span{display:block;font-size:12px;color:var(--tx2);margin-top:2px}
.ln .z{text-align:right;flex:none}
.num{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.qty{width:76px!important;text-align:center;padding:8px!important}
.x{border:0;background:none;color:var(--tx3);font-size:20px;line-height:1;padding:2px 6px}
.btn{border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:800;font-size:16px;min-height:50px;width:100%}
.btn:disabled{opacity:.45}
.btn.s{min-height:40px;font-size:14px;width:auto;padding:0 14px;border-radius:10px}
.btn.ok{background:var(--ok)}
.btn.bad{background:none;border:1px solid var(--bad);color:var(--bad)}
.btn.gh{background:none;border:1px solid var(--line);color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--line);padding-top:10px;margin-top:4px;font-size:14px}
.empty{font-size:14px;color:var(--tx3);text-align:center;padding:18px 8px}
.flow{display:flex;gap:4px;margin:8px 0 2px;flex-wrap:wrap}
.flow i{font-style:normal;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--bg);color:var(--tx3);border:1px solid var(--line)}
.flow i.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.flow i.dn{background:var(--ok-s);color:var(--ok);border-color:transparent}
.grp{font-size:13px;font-weight:800;margin:14px 0 2px;display:flex;justify-content:space-between;gap:8px}
.cot{display:grid;grid-template-columns:1fr 110px auto;gap:6px;align-items:center;margin-top:6px}
.cot .win{font-size:12px}
.note{font-size:12px;color:var(--tx2);background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.4;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--tx2)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.molist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px}
.mogrp{position:sticky;top:0;background:var(--bg);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);font-weight:700;padding:6px 12px;border-bottom:1px solid var(--line)}
.mochk{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.mochk input{width:20px;height:20px;flex:none;margin-top:1px}
.mochk span{min-width:0;overflow-wrap:anywhere}
.mochk small{display:block;font-size:12px;color:var(--tx2)}
.hdr .mg{margin-left:auto;height:52px;width:auto;flex:none}
.modo{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
.modo button{border:0;background:var(--panel);padding:6px 14px;font-size:13px;font-weight:700;color:var(--tx2)}
.modo button[aria-pressed="true"]{background:var(--ac);color:#fff}
.envio{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:70;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.envio .card{width:100%;max-width:520px;margin:0}
.sku{font-family:ui-monospace,Menlo,monospace;font-size:.92em;color:var(--ac);font-weight:700}
.tp small{display:block;font-size:11px;font-weight:600;opacity:.8}
.lk{background:none;border:0;color:var(--tx3);font-size:12px;padding:4px 0}
.lk.bad{color:var(--bad)}

<meta http-equiv="Cache-Control" content="no-cache">
<script>
const APPVER='v14';
(async()=>{ try{ const t=await (await fetch('index.html?_='+Date.now(),{cache:'no-store'})).text(); const m=t.match(/APPVER='([^']+)'/); if(m&&m[1]!==APPVER){ location.replace(location.pathname+'?v='+m[1]); } }catch(e){} })();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') fetch('index.html?_='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{ const m=t.match(/APPVER='([^']+)'/); if(m&&m[1]!==APPVER) location.replace(location.pathname+'?v='+m[1]); }).catch(()=>{}); });
</script>

<body>
<div id="app">
  <div class="hdr">
    <div class="logos"><img alt="DIMACO" src="logo-dimaco.png"></div>
    <div><h1>Estación RFQ</h1><p>Insumos y materiales · DIMACO</p></div>
    <img class="mg" alt="Marca Guanajuato Internacional" src="logo-mg.png">
  </div>
  <div id="quien"></div>
  <div class="tabs" id="tabs" role="tablist" hidden></div>
  <div id="view"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
/* Estación RFQ · DIMACO — cliente conectado al servidor dimaco-rfq (Cloudflare). Sin datos en este archivo. */
const API = (function(){ try{ return localStorage.getItem('rfq-api') || 'https://dimaco-rfq.moises-pena.workers.dev'; }catch(e){ return 'https://dimaco-rfq.moises-pena.workers.dev'; } })();
const LIMITE = 10000;
const fmt = n => n==null||isNaN(n) ? '—' : '$'+Number(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const nfmt = n => Number(n).toLocaleString('es-MX');
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hoyISO = () => new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City'}).format(new Date());
const fFecha = iso => { if(!iso) return ''; const [y,m,d]=iso.slice(0,10).split('-'); return `${d}/${m}/${y}`; };
const venc = iso => { const d=new Date(iso+'T12:00:00'); d.setMonth(d.getMonth()+6); return d.toISOString().slice(0,10); };
const imp = l => (l.precio||0)*l.qty;
const autorizador = l => imp(l) > LIMITE ? 'moises' : 'paty';
const NOMBRES = {ely:'Ely',uriel:'Uriel',gerardo:'Gerardo',lupita:'Lupita',paty:'Paty',moises:'Moisés'};
const TABN = {pedir:'Pedir',mias:'Mis req.',recibir:'Recibir',pend:'Pendientes',facturas:'Facturas',autorizar:'Autorizar',todas:'Todas'};
const EST = {
  cotizar:['A cotizar','c-cot'], autorizar:['Por autorizar','c-aut'], pedir:['Autorizado · por pedir','c-ped'],
  pedido:['Pedido','c-ped'], parcial:['Llegó parcial','c-aut'], recibido:['Recibido','c-ok'],
  facturado:['Registrado en Bind','c-ok'], rechazado:['Rechazado','c-bad'], cancelado:['Cancelado','c-gr']
};
const PASOS = ['cotizar','autorizar','pedir','pedido','recibido','facturado'];
/* SKU + nombre: todos pedimos con el mismo lenguaje */
const skuDe = l => { if(/^INS-/.test(l.k||'')) return l.k; const p=String(l.d||'').split(' · '); return p.length>1?p[p.length-1]:''; };
const nomDe = l => { const p=String(l.d||'').split(' · '); return (/^INS-/.test(l.k||'')||p.length<2) ? String(l.d||'') : p.slice(0,-1).join(' · '); };
const etq = l => { const s=skuDe(l); return (s?`<span class="sku">${esc(s)}</span> · `:'')+esc(nomDe(l)); };
const esKatK = k => /^K\d+$/.test(k||'');
/* alerta de sonido: requisiciones de Uriel o Gerardo suenan para Paty, Lupita, Ely y Moisés */
const ALERTA_PARA = ['paty','lupita','ely','moises'];
let AUDIO = null, VISTAS = null;
function activarAudio(){ try{ if(!AUDIO) AUDIO=new (window.AudioContext||window.webkitAudioContext)(); if(AUDIO.state==='suspended') AUDIO.resume(); }catch(e){} }
document.addEventListener('pointerdown', activarAudio, {capture:true});
function sonar(){ try{ if(!AUDIO) return; const t=AUDIO.currentTime+0.05; [[0,880],[0.22,1320],[0.44,880],[0.66,1320]].forEach(([dt,f])=>{ const o=AUDIO.createOscillator(), g=AUDIO.createGain(); o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(AUDIO.destination); g.gain.setValueAtTime(0.0001,t+dt); g.gain.exponentialRampToValueAtTime(0.5,t+dt+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dt+0.19); o.start(t+dt); o.stop(t+dt+0.2); }); }catch(e){} }
function revisarAlertas(al){
  if(!YO || !ALERTA_PARA.includes(YO.id) || !Array.isArray(al)) return;
  const key='rfq-vistas-'+YO.id;
  if(VISTAS===null){ let prev=null; try{ prev=JSON.parse(localStorage.getItem(key)||'null'); }catch(e){} VISTAS=new Set(prev||[]); if(!prev){ al.forEach(a=>VISTAS.add(a.id)); try{ localStorage.setItem(key,JSON.stringify([...VISTAS])); }catch(e){} return; } }
  const nuevas=al.filter(a=>!VISTAS.has(a.id)); if(!nuevas.length) return;
  nuevas.forEach(a=>VISTAS.add(a.id)); try{ localStorage.setItem(key,JSON.stringify([...VISTAS].slice(-300))); }catch(e){}
  sonar(); toast('Nueva requisición de producción: '+nuevas.map(a=>a.folio+' de '+(NOMBRES[a.quien]||a.quien)+' ('+a.para+')').join(', '), 8000);
}
function confirmar2(b, txt){ if(b.dataset.ok==='1') return true; b.dataset.ok='1'; const t=b.textContent; b.textContent=txt; setTimeout(()=>{ if(b.isConnected){ b.dataset.ok=''; b.textContent=t; } },5000); return false; }
let tipoPed = '', rfqExcl = new Set(), rfqProvK = '', rfqProvI = '';
let armDoc = 'rfq', armTipo = 'mat', armProv = '', armSel = new Set(), armPrecio = {};

let PIN = ''; try{ PIN = localStorage.getItem('rfq-pin')||''; }catch(e){}
let YO = null, CAT = [], BYK = {}, REQS = [], ALTAS = [], PROVS = [], MOS = null, TAB = '', cargando = false, altaForm = null;
let modoReq = '';
let carrito = [], paraTipo = '', mos = [], moFil = '', busq = '', borradorCot = {};
try{ const d=JSON.parse(localStorage.getItem('rfq-carrito')||'null'); if(d){ carrito=d.c||[]; paraTipo=d.t||''; mos=Array.isArray(d.m)?d.m:[]; tipoPed=d.tp||''; } }catch(e){}
const guardarCarrito = () => { try{ localStorage.setItem('rfq-carrito',JSON.stringify({c:carrito,t:paraTipo,m:mos,tp:tipoPed})); }catch(e){} };

function tabsDe(u){
  if(u==='paty') return ['pend','pedir','facturas','mias','todas'];
  if(u==='moises') return ['autorizar','pend','pedir','facturas','mias','todas'];
  if(u==='ely') return ['pedir','mias','recibir'];
  return ['pedir','mias'];
}
function toast(t,ms){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),ms||2600); }

async function api(path, body){
  const r = await fetch(API+path, { method: body?'POST':'GET', headers: Object.assign({'X-Pin':PIN}, body?{'Content-Type':'application/json'}:{}), body: body?JSON.stringify(body):undefined });
  let d=null; try{ d=await r.json(); }catch(e){}
  if(r.status===401){ salir('PIN incorrecto'); throw new Error('PIN incorrecto'); }
  if(!r.ok || !d || d.ok===false) throw new Error((d&&d.error)||('Error '+r.status));
  return d;
}
async function entrar(){
  const v=document.getElementById('views');
  try{
    cargando=true; render();
    const yo = await api('/yo'); YO = yo.yo; TAB = TAB && tabsDe(YO.id).includes(TAB) ? TAB : tabsDe(YO.id)[0];
    try{ localStorage.setItem('rfq-pin',PIN); }catch(e){}
    const [c,d] = await Promise.all([api('/catalogo'), api('/datos')]);
    CAT = c.catalogo; BYK = Object.fromEntries(CAT.map(x=>[x.k,x])); REQS = d.reqs; ALTAS = d.altas||[]; PROVS = d.provs;
    cargando=false; render(); revisarAlertas(d.alertas);
    api('/mos').then(m=>{ MOS=m; if(TAB==='pedir') render(); }).catch(()=>{ MOS={mafesa:0,mos:[],nota:'No se pudo leer Katana'}; });
  }catch(e){ cargando=false; if(YO===null) { render(); if(e.message!=='PIN incorrecto') toast(e.message.includes('fetch')?'Sin conexión con el servidor':e.message); } }
}
function salir(msg){ YO=null; PIN=''; VISTAS=null; try{ localStorage.removeItem('rfq-pin'); }catch(e){} render(); if(msg) toast(msg); }
async function refrescar(){
  if(!YO) return;
  const a=document.activeElement;
  if(document.hidden || (a && (a.tagName==='INPUT'||a.tagName==='SELECT'))){   // sin redibujar: solo revisa si hay alertas nuevas
    if(ALERTA_PARA.includes(YO.id)) try{ const d=await api('/datos'); revisarAlertas(d.alertas); }catch(e){}
    return; }
  try{ const d=await api('/datos'); REQS=d.reqs; ALTAS=d.altas||[]; PROVS=d.provs; render(); revisarAlertas(d.alertas); }catch(e){}
}
setInterval(refrescar, 30000);
document.addEventListener('visibilitychange', refrescar);

async function accion(body, okMsg){
  try{
    const d = await api('/accion', body);
    REQS = d.reqs; ALTAS = d.altas||ALTAS; PROVS = d.provs;
    if(d.cat){ Object.entries(d.cat).forEach(([k,o])=>{ if(BYK[k]) Object.assign(BYK[k],{p:o.p,s:o.s||BYK[k].s,f:o.f}); else { const n={k,d:o.d,p:o.p,s:o.s,f:o.f,c:'Nuevo'}; CAT.push(n); BYK[k]=n; } }); }
    render(); toast(okMsg || d.msg || 'Listo'); revisarAlertas(d.alertas); return d;
  }catch(e){ toast(e.message); return null; }
}

/* ---------------- vistas ---------------- */
function render(){
  const roles=document.getElementById('quien'), tabs=document.getElementById('tabs'), v=document.getElementById('view');
  if(!YO){
    roles.innerHTML=''; tabs.hidden=true;

function cargarScript(src){ return new Promise((ok,err)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok(); const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>err(new Error('No se pudo cargar '+src)); document.head.appendChild(s); }); }

function numLetras(n){
  const U=['','UN','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE','VEINTIÚN','VEINTIDÓS','VEINTITRÉS','VEINTICUATRO','VEINTICINCO','VEINTISÉIS','VEINTISIETE','VEINTIOCHO','VEINTINUEVE'];
  const D=['','','','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
  const C=['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
  const cien=x=>{ if(x===0) return ''; if(x===100) return 'CIEN'; const c=Math.floor(x/100), r=x%100; let s=C[c]; if(r){ s+=(s?' ':'')+(r<30?U[r]:D[Math.floor(r/10)]+(r%10?' Y '+U[r%10]:'')); } return s; };
  const ent=Math.floor(n), cen=Math.round((n-ent)*100);
  const mill=Math.floor(ent/1e6), miles=Math.floor((ent%1e6)/1000), res=ent%1000;
  let s=''; if(mill) s+=(mill===1?'UN MILLÓN':cien(mill)+' MILLONES')+' ';
  if(miles) s+=(miles===1?'MIL':cien(miles)+' MIL')+' ';
  s+=cien(res); s=s.trim()||'CERO';
  return `${s} PESOS ${String(cen).padStart(2,'0')}/100 M.N.`;
}

  try{ const f = await pdfDoc(tipo, folio, xs, provRfq); const m=document.getElementById('envio'); if(PDF_LISTO && m && !m.hidden){ PDF_COLA.push(f); mostrarEnvio(); } else { PDF_LISTO = f; mostrarEnvio(); } }catch(e){ toast(e.message); }
}
function mostrarEnvio(){
  let m=document.getElementById('envio'); if(!m){ m=document.createElement('div'); m.id='envio'; document.body.appendChild(m); }
  m.className='envio'; m.innerHTML=`<div class="card" role="dialog" aria-label="Enviar PDF"><h2>${esc(PDF_LISTO.name)}</h2><div class="sub">Listo para mandarlo al proveedor.${PDF_COLA.length?` Después sigue${PDF_COLA.length>1?'n':''} ${PDF_COLA.length} más.`:''}</div>
    <div class="row"><button class="btn s" type="button" id="env-share">Enviar (WhatsApp / correo)</button><button class="btn s gh" type="button" id="env-dl">Descargar</button><button class="btn s gh" type="button" id="env-x">${PDF_COLA.length?'Siguiente':'Cerrar'}</button></div></div>`;
  m.hidden=false;
}
document.addEventListener('click', async e=>{
  const b=e.target.closest('#env-share,#env-dl,#env-x'); if(!b||!PDF_LISTO) return;
  if(b.id==='env-x'){ if(PDF_COLA.length){ PDF_LISTO=PDF_COLA.shift(); mostrarEnvio(); } else document.getElementById('envio').hidden=true; return; }
  if(b.id==='env-share'){ try{ if(navigator.canShare && navigator.canShare({files:[PDF_LISTO]})){ await navigator.share({files:[PDF_LISTO], title:PDF_LISTO.name}); return; } }catch(err){ if(err&&err.name==='AbortError') return; } }
  const a=document.createElement('a'); a.href=URL.createObjectURL(PDF_LISTO); a.download=PDF_LISTO.name; document.body.appendChild(a); a.click(); a.remove(); toast('PDF descargado');
});

function vRecibir(){
  const L=allLines().filter(x=>x.l.est==='pedido'||x.l.est==='parcial');
  const g={}; L.forEach(x=>{const p=x.l.prov||'—';(g[p]=g[p]||[]).push(x);});
  return `<div class="card"><h2>Recibir material</h2><div class="sub">Anota cuántas piezas llegaron de cada renglón. Fecha y hora se ponen solas. Si falta algo, queda abierto y Paty recibe aviso.</div>
  ${L.length?Object.entries(g).map(([p,xs])=>`<div class="grp"><span>${esc(p)}</span></div>${xs.map(({r,l,i})=>{const falta=l.qty-l.rec;return `<div class="ln"><div class="a"><b>${etq(l)}</b><span>${r.folio}${l.po?' · '+esc(l.po):''} · pedido el ${fFecha(l.pedidoF)} · pidió ${nfmt(l.qty)}${l.rec?` · ya llegaron ${nfmt(l.rec)}`:''}</span><span><b style="display:inline;color:var(--warn)">Faltan ${nfmt(falta)}</b></span></div>
    <div class="z"><input class="qty" type="number" min="0" max="${falta}" inputmode="numeric" id="rc-${r.id}-${i}" value="${falta}" aria-label="Piezas que llegaron"><div style="margin-top:6px"><button class="btn s ok" type="button" data-rec="${r.id}:${i}">Llegó</button></div></div></div>`}).join('')}`).join(''):'<div class="empty">No hay material en camino.</div>'}
  </div>`;
}
function vFacturas(){
  const L=allLines().filter(x=>x.l.est==='recibido');
  const g={}; L.forEach(x=>{const p=x.l.prov||'—';(g[p]=g[p]||[]).push(x);});
  return `<div class="card"><h2>Facturas · martes y viernes</h2><div class="sub">Cruce de lo pedido contra lo que recibió Ely y lo facturado. Captura el subtotal de la factura (sin IVA); solo se registra en Bind lo que cuadra.</div>
  ${L.length?Object.entries(g).map(([p,xs],gi)=>{const esp=xs.reduce((a,x)=>a+x.l.rec*(x.l.precio||0),0);return `<div class="grp"><span>${esc(p)}</span></div>
    ${xs.map(({r,l})=>`<div class="ln"><div class="a"><b>${etq(l)}</b><span>${r.folio} · pedido ${nfmt(l.qty)} · recibido ${nfmt(l.rec)} · ${fmt(l.precio)} c/u</span></div><div class="z num">${fmt(l.rec*(l.precio||0))}</div></div>`).join('')}
    <div class="tot"><span>Debe facturar</span><span class="num">${fmt(esp)}</span></div>
    <div class="row2" style="margin-top:8px"><div><label class="f" for="ff-${gi}" style="margin-top:0">Folio factura</label><input type="text" id="ff-${gi}" placeholder="Ej. A-1234"></div>
    <div><label class="f" for="fs-${gi}" style="margin-top:0">Subtotal</label><input type="number" step="0.01" inputmode="decimal" id="fs-${gi}" data-fac="${gi}" data-esp="${esp}" placeholder="$"></div></div>
    <div class="sub" id="cruce-${gi}" style="margin-top:6px"></div>
    <button class="btn s ok" type="button" data-bind="${esc(p)}" data-gi="${gi}" disabled>Registrado en Bind</button>`}).join(''):'<div class="empty">No hay material recibido por facturar.</div>'}
  </div>`;
}

/* ---------------- eventos ---------------- */
const app=document.getElementById('app');
const ref = s => { const [rid,i,j]=s.split(':'); const r=REQS.find(x=>x.id==rid); return {r,l:r&&r.lines[+i],rid:+rid,i:+i,j:j!=null?+j:null}; };
app.addEventListener('submit',async e=>{ if(e.target.id==='falta'){ e.preventDefault();
    const r=await accion({tipo:'alta',d:document.getElementById('al-d').value,u:document.getElementById('al-u').value,prov:document.getElementById('al-p').value,nota:document.getElementById('al-n').value});
    if(r){ altaForm=null; render(); } return; }
  if(e.target.id==='flogin'){ e.preventDefault(); PIN=document.getElementById('pin').value.trim(); if(PIN) entrar(); } });
app.addEventListener('click',async e=>{
  const b=e.target.closest('button'); if(!b) return;
  const d=b.dataset;
  if(b.id==='salir'){ salir(); return; }
  if(b.id==='sonido'){ activarAudio(); setTimeout(()=>{ sonar(); render(); toast('Sonido activo: suena cuando Uriel o Gerardo piden material'); },150); return; }
  if(d.tp){ tipoPed=d.tp; busq=''; guardarCarrito(); render(); const q=document.getElementById('q'); if(q) q.focus(); return; }
  if(d.borrar||d.borrarl||d.borrarped){
    if(!confirmar2(b,'Toca otra vez para borrar')) return;
    const motivo = ((window.prompt&&window.prompt('Motivo (opcional)'))||'').trim();
    if(d.borrarped) accion({tipo:'borrarPedido',no:d.borrarped,motivo});
    else if(d.borrar) accion({tipo:'borrar',rid:+d.borrar,motivo});
    else { const x=ref(d.borrarl); accion({tipo:'borrar',rid:x.rid,i:x.i,motivo}); }
    return; }
  if(d.rfqgo){ const t=d.rfqgo;
    const xs=allLines().filter(x=>x.l.est==='cotizar' && (t==='k' ? (esKatK(x.l.k)&&!x.l.poId) : (!esKatK(x.l.k)&&!x.l.rfqI)) && !rfqExcl.has(x.r.id+':'+x.i));
    if(!xs.length){ toast('Marca al menos un renglón'); return; }
    const prov = t==='k'?rfqProvK:rfqProvI;
    if(t==='k' && !confirmar2(b,'Confirmar: crear RFQ en Katana')) return;
    b.disabled=true; b.textContent=t==='k'?'Creando RFQ en Katana…':'Creando RFQ…';
    const r=await accion({tipo:t==='k'?'rfqKatana':'rfqInsumos', keys:xs.map(x=>x.r.id+':'+x.i), prov});
    if(r&&r.po){ if(t==='k') rfqProvK=''; else rfqProvI=''; prepararPDF('rfq', r.po.no, r.po.keys, r.po.prov); }
    return; }
  if(d.armdoc){ armDoc=d.armdoc; armSel.clear(); render(); return; }
  if(d.armtipo){ armTipo=d.armtipo; armSel.clear(); render(); return; }
  if(d.armtodos){ const ks=Object.keys(armGrupos()); if(ks.every(k=>armSel.has(k))) armSel.clear(); else ks.forEach(k=>armSel.add(k)); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(d.armgo){
    const G=armGrupos(), ks=Object.keys(G).filter(k=>armSel.has(k)); if(!ks.length) return;
    const keys=[], precios={}; ks.forEach(k=>{ const pr=armDoc==='compra'?armPrecioDe(k,G[k]):null; G[k].forEach(x=>{ const kk=x.r.id+':'+x.i; keys.push(kk); if(pr!=null) precios[kk]=pr; }); });
    const mat=armTipo==='mat';
    if(mat && !confirmar2(b, armDoc==='rfq'?'Confirmar: crear RFQ en Katana':'Confirmar: crear PO en Katana')) return;
    b.disabled=true; b.textContent='Creando…';
    const body = armDoc==='rfq' ? {tipo: mat?'rfqKatana':'rfqInsumos', keys, prov: armProv} : {tipo:'compraArmada', keys, prov: armProv, precios, mat};
    const r=await accion(body);
    if(r){ armSel.clear(); armPrecio={}; const pos=r.pos||(r.po?[r.po]:[]); for(const po of pos) await prepararPDF(po.tipo||'oc', po.no, po.keys, po.prov); }
    return; }
  if(d.rfqipdf){ const xs=allLines().filter(x=>x.l.rfqI===d.rfqipdf); prepararPDF('rfq', d.rfqipdf, xs.map(x=>x.r.id+':'+x.i)); return; }
  if(d.tab){ TAB=d.tab; render(); window.scrollTo(0,0); return; }
  if(d.add){ const c=BYK[d.add]; if(!carrito.find(x=>x.k===c.k)) carrito.push(modoReq?{k:c.k,d:c.d,qty:1,modo:modoReq}:{k:c.k,d:c.d,qty:1}); busq=''; guardarCarrito(); render(); toast('Agregado'); return; }
  if(d.nuevo){ altaForm={d:busq.trim().toUpperCase()}; busq=''; render(); const x=document.getElementById('al-u'); if(x) x.focus(); return; }
  if(b.id==='al-x'){ altaForm=null; render(); return; }
  if(d.apalta){ accion({tipo:'aprobarAlta',id:+d.apalta}).then(r=>{ if(r) api('/catalogo').then(c=>{ CAT=c.catalogo; BYK=Object.fromEntries(CAT.map(x=>[x.k,x])); }); }); return; }
  if(d.rechalta){ accion({tipo:'rechazarAlta',id:+d.rechalta}); return; }
  if(d.del){ carrito.splice(+d.del,1); guardarCarrito(); render(); return; }
  if(d.cmall){ modoReq=d.cmall; carrito.forEach(x=>x.modo=modoReq); guardarCarrito(); render(); return; }
  if(d.cm){ const [i,m]=d.cm.split('|'); carrito[+i].modo=m; guardarCarrito(); render(); return; }
  if(d.unmo){ mos=mos.filter(x=>x!==d.unmo); guardarCarrito(); render(); return; }
  if(d.para){ paraTipo=d.para; guardarCarrito(); render(); return; }
  if(b.id==='yo-est'||b.id==='yo-kat'){
    const kat=b.id==='yo-kat';
    if(kat&&b.dataset.ok!=='1'){ b.dataset.ok='1'; b.textContent='Confirmar: crear PO en Katana'; setTimeout(()=>{ if(b.isConnected){ b.dataset.ok=''; b.textContent='Pedir yo con PO en Katana + PDF'; } },5000); return; }
    b.disabled=true;
    const provs=[...new Set(carrito.map(l=>{ const c=l.k?BYK[l.k]:null; return l.prov||(c&&c.s)||''; }))];
    const r = await accion({tipo:'crear', para: paraTipo==='planta'?'Uso planta':mos.join(', '), items: carrito.map(x=>{ const c=x.k?BYK[x.k]:null; return {k:x.k,d:x.d,qty:x.qty,modo:'compra',prov:x.prov||(c&&c.s)||'',precio:x.precio||(c&&c.p)||null}; })});
    if(!r){ b.disabled=false; return; }
    modoReq=''; carrito=[]; paraTipo=''; mos=[]; moFil=''; guardarCarrito(); render();
    for(const p of provs){ const d=await accion({tipo: kat?'katanaPO':'pedir', prov:p, rid:r.rid}); if(d) for(const po of (d.pos||(d.po?[d.po]:[]))) await prepararPDF('oc', po.no, po.keys); }
    return;
  }
  if(b.id==='enviar'){
    b.disabled=true;
    const r = await accion({tipo:'crear', para: paraTipo==='planta'?'Uso planta':mos.join(', '), items: carrito.map(x=>({k:x.k,d:x.d,qty:x.qty,modo:x.modo,prov:x.prov,precio:x.precio}))});
    if(r){ modoReq=''; carrito=[]; paraTipo=''; mos=[]; moFil=''; guardarCarrito(); TAB='mias'; render(); toast(`${r.folio} enviada a Paty`); } else b.disabled=false;
    return;
  }
  if(d.aut){ const x=ref(d.aut); accion({tipo:'autorizar',rid:x.rid,i:x.i}); return; }
  if(d.rech){ const x=ref(d.rech); accion({tipo:'rechazar',rid:x.rid,i:x.i}); return; }
  if(d.cancel){ const x=ref(d.cancel); accion({tipo:'cancelar',rid:x.rid,i:x.i}); return; }
  if(d.win){ const x=ref(d.win); const key=x.rid+':'+x.i; const cs=borradorCot[key]||x.l.cot;
    const ok = await accion({tipo:'cotizacion',rid:x.rid,i:x.i,cot:cs},'Guardado');
    if(ok){ delete borradorCot[key]; accion({tipo:'ganador',rid:x.rid,i:x.i,j:x.j}); } return; }
  if(d.rfqtxt){ const {r,l}=ref(d.rfqtxt); copiar(`Solicitud de cotización · DIMACO METALMECANICA\nFolio: ${r.folio}\n\nFavor de cotizar:\n- ${nfmt(l.qty)} ${esc(l.u||'pz')} · ${l.d}\n\nIndicar precio unitario sin IVA y tiempo de entrega.\nResponder a Patricia Peña.`); return; }
  if(d.pedtxt){ const xs=allLines().filter(x=>x.l.est==='pedir'&&x.l.prov===d.pedtxt); const tot=xs.reduce((a,x)=>a+imp(x.l),0);
    copiar(`Pedido · DIMACO METALMECANICA · ${d.pedtxt}\n\n`+xs.map(x=>`- ${nfmt(x.l.qty)} ${esc(x.l.u||'pz')} · ${x.l.d} · ${fmt(x.l.precio)} c/u = ${fmt(imp(x.l))}`).join('\n')+`\n\nSubtotal: ${fmt(tot)} + IVA\nReferencia: ${[...new Set(xs.map(x=>x.r.folio))].join(', ')}\nFacturar y enviar a Patricia Peña.`); return; }
  if(d.pedir){ const d3=await accion({tipo:'pedir',prov:d.pedir}); if(d3) for(const po of (d3.pos||(d3.po?[d3.po]:[]))) await prepararPDF('oc', po.no, po.keys); return; }
  if(d.modo){ const [key,m]=d.modo.split('|'); const x=ref(key);
    if(m==='rfq'){ if(x.l.est!=='cotizar') accion({tipo:'aRFQ',rid:x.rid,i:x.i}); else { delete compraForm[key]; render(); } }
    else { if(x.l.est==='cotizar'){ compraForm[key]=true; render(); } } return; }
  if(d.acompra){ const x=ref(d.acompra); const pv=document.getElementById('cm-p-'+x.rid+'-'+x.i).value, pr=document.getElementById('cm-v-'+x.rid+'-'+x.i).value;
    const r0=await accion({tipo:'aCompra',rid:x.rid,i:x.i,prov:pv,precio:pr}); if(r0) delete compraForm[d.acompra]; render(); return; }
  if(false&&d.rfqkat){ if(b.dataset.ok!=='1'){ b.dataset.ok='1'; b.textContent='Confirmar: crear RFQ en Katana'; b.classList.add('ok'); setTimeout(()=>{ if(b.isConnected){ b.dataset.ok=''; render(); } },5000); return; }
    b.disabled=true; b.textContent='Creando RFQ en Katana…'; const d0=await accion({tipo:'rfqKatana'}); if(d0&&d0.po) prepararPDF('rfq', d0.po.no, d0.po.keys); return; }
  if(d.confpo){ if(b.dataset.ok!=='1'){ b.dataset.ok='1'; b.textContent='Toca otra vez para confirmar'; b.classList.add('ok'); setTimeout(()=>{ if(b.isConnected){ b.dataset.ok=''; render(); } },5000); return; }
    b.disabled=true; b.textContent='Confirmando en Katana…'; const d1=await accion({tipo:'confirmarPO',poId:+d.confpo}); if(d1&&d1.po) prepararPDF('oc', d1.po.no, d1.po.keys); return; }
  if(d.rfqpdf){ prepararPDF('rfq', 'RFQ-'+ref(d.rfqpdf).r.folio, [d.rfqpdf]); return; }
  if(false&&d.rfqall){ const xs=allLines().filter(x=>x.l.est==='cotizar'&&!/^K\d+$/.test(x.l.k||'')); prepararPDF('rfq', 'RFQ-'+[...new Set(xs.map(x=>x.r.folio))].join('-'), xs.map(x=>x.r.id+':'+x.i)); return; }

  if(d.pdfg){ const xs=PDFG[d.pdfg]; if(xs) prepararPDF('oc', xs[0].l.po||xs[0].l.oc||('OC-'+xs[0].r.folio), xs.map(x=>x.r.id+':'+x.i)); return; }
  if(d.kpo){ if(b.dataset.ok!=='1'){ b.dataset.ok='1'; b.textContent='Confirmar: crear PO en Katana'; b.classList.add('ok'); setTimeout(()=>{ if(b.isConnected){ b.dataset.ok=''; b.textContent='Crear PO en Katana'; b.classList.remove('ok'); } },5000); return; }
    b.disabled=true; b.textContent='Creando en Katana…'; const d2=await accion({tipo:'katanaPO',prov:d.kpo}); if(d2&&d2.po) prepararPDF('oc', d2.po.no, d2.po.keys); return; }
  if(d.rec){ const x=ref(d.rec); const n=+document.getElementById(`rc-${x.rid}-${x.i}`).value||0; accion({tipo:'recibir',rid:x.rid,i:x.i,n}); return; }
  if(d.bind){ const gi=d.gi; accion({tipo:'bind',prov:d.bind,subtotal:+document.getElementById('fs-'+gi).value,factura:document.getElementById('ff-'+gi).value}); return; }
});
app.addEventListener('input',e=>{
  const t=e.target, d=t.dataset;
  if(t.id==='mofil'){ moFil=t.value; const pos=t.selectionStart; render(); const q=document.getElementById('mofil'); q.focus(); try{q.setSelectionRange(pos,pos);}catch(_){} return; }
  if(t.id==='q'){ busq=t.value; const pos=t.selectionStart; render(); const q=document.getElementById('q'); q.focus(); try{q.setSelectionRange(pos,pos);}catch(_){} return; }
  if(d.qi!=null){ carrito[+d.qi].qty=Math.max(1,+t.value||1); guardarCarrito(); return; }
  if(d.cpv!=null){ carrito[+d.cpv].precio=+t.value||null; guardarCarrito(); return; }
  if(d.fac!=null){ const v=+t.value, esp=+d.esp, out=document.getElementById('cruce-'+d.fac), bt=document.querySelector(`[data-gi="${d.fac}"]`);
    if(!t.value){ out.textContent=''; bt.disabled=true; return; }
    const dif=v-esp; const ok=Math.abs(dif)<0.5;
    out.innerHTML= ok?'<span class="chip c-ok">Cuadra</span> Se puede registrar en Bind.':`<span class="chip c-bad">No cuadra</span> La factura trae ${fmt(Math.abs(dif))} ${dif>0?'de más':'de menos'}. Revísala con el proveedor antes de registrar.`;
    bt.disabled=!ok; return; }
});
app.addEventListener('change',async e=>{
  const t=e.target, d=t.dataset;
  if(d.cpp!=null){ let v=t.value; if(v==='__otro'){ v=((window.prompt&&window.prompt('Nombre del proveedor'))||'').trim(); } carrito[+d.cpp].prov=v||''; guardarCarrito(); render(); return; }
  if(d.cpv!=null){ render(); return; }
  if(d.qi!=null){ render(); return; }
  if(d.armk){ if(t.checked) armSel.add(d.armk); else armSel.delete(d.armk); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(d.armprov){ let v=t.value; if(v==='__otro'){ v=((window.prompt&&window.prompt('Nombre del proveedor'))||'').trim(); } armProv=v; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(d.armp){ armPrecio[d.armp]=t.value===''?null:+t.value; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(d.rfqsel){ if(t.checked) rfqExcl.delete(d.rfqsel); else rfqExcl.add(d.rfqsel); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(d.rfqprov){ let v=t.value; if(v==='__otro'){ v=((window.prompt&&window.prompt('Nombre del proveedor'))||'').trim(); } if(d.rfqprov==='k') rfqProvK=v; else rfqProvI=v; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(d.mo){ const i=mos.indexOf(d.mo); if(t.checked&&i<0) mos.push(d.mo); if(!t.checked&&i>=0) mos.splice(i,1); guardarCarrito(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(d.cot){ const [rid,i,j,f]=d.cot.split(':'); const key=rid+':'+i; const x=ref(key);
    const cs=(borradorCot[key]||x.l.cot||[]).map(c=>Object.assign({},c)); while(cs.length<3) cs.push({prov:'',precio:null});
    let v=t.value; if(f==='prov'&&v==='__otro'){ v=(window.prompt&&window.prompt('Nombre del proveedor'))||''; v=v.trim(); if(!v){ render(); return; } }
    cs[+j][f]= f==='precio'?(v===''?null:+v):v; borradorCot[key]=cs;
    await accion({tipo:'cotizacion',rid:+rid,i:+i,cot:cs},'Cotización guardada'); delete borradorCot[key]; return; }
  if(d.asig){ const x=ref(d.asig); let v=t.value; if(v==='__otro'){ v=(window.prompt&&window.prompt('Nombre del proveedor'))||''; } if(v) accion({tipo:'asignar',rid:x.rid,i:x.i,prov:v}); return; }
});
function copiar(txt){
  const ok=()=>toast('Copiado: pégalo en el correo o WhatsApp');
  try{ navigator.clipboard.writeText(txt).then(ok,()=>mostrar(txt)); }catch(e){ mostrar(txt); }
}
function mostrar(txt){ const v=document.getElementById('view'); const n=document.createElement('div'); n.className='card'; n.innerHTML=`<h2>Texto para copiar</h2><div class="note">${esc(txt)}</div>`; v.prepend(n); window.scrollTo(0,0); }

render();
if(PIN) entrar();
