<title>Estación RFQ · DIMACO</title>
<style>
/* Layout: una columna tipo app de estación (máx. 560px), barra de rol arriba, pestañas por rol, tarjetas por renglón */
:root{
  --bg:#f2f4f6;--panel:#ffffff;--line:#d8dfe5;--tx:#14202a;--tx2:#4f5e69;--tx3:#7d8c97;
  --ac:#1f5fa8;--ac-s:#e2ecf8;--ok:#1a7f37;--ok-s:#e2f3e6;--bad:#b42318;--bad-s:#fcebea;
  --warn:#946200;--warn-s:#fbf1d9;--vio:#6b3fa0;--vio-s:#efe7f8;--logo:#ffffff;
  --f:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151a;--panel:#18212899;--line:#2b3842;--tx:#e6edf2;--tx2:#a5b3bd;--tx3:#7a8a95;
  --ac:#6aa7ec;--ac-s:#1b2d42;--ok:#5cc27a;--ok-s:#173022;--bad:#f0837a;--bad-s:#3a1c1a;
  --warn:#e5b54a;--warn-s:#3a2e12;--vio:#b897e3;--vio-s:#2c2140;--logo:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151a;--panel:#18212899;--line:#2b3842;--tx:#e6edf2;--tx2:#a5b3bd;--tx3:#7a8a95;
  --ac:#6aa7ec;--ac-s:#1b2d42;--ok:#5cc27a;--ok-s:#173022;--bad:#f0837a;--bad-s:#3a1c1a;
  --warn:#e5b54a;--warn-s:#3a2e12;--vio:#b897e3;--vio-s:#2c2140;--logo:#ffffff;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:var(--f);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.logos{display:flex;align-items:center;gap:8px;background:var(--logo);border:1px solid var(--line);border-radius:12px;padding:6px 10px;flex:none}
.logos img{height:34px;width:auto;display:block}
.hdr h1{font-size:20px;margin:0;line-height:1.1}
.hdr p{margin:2px 0 0;font-size:12px;color:var(--tx2)}
.proto{font-size:12px;color:var(--warn);background:var(--warn-s);border-radius:10px;padding:8px 10px;margin-bottom:10px;line-height:1.4}
.proto button{background:none;border:0;color:var(--ac);font-weight:700;padding:0;font-size:12px}
.roles{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.roles button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--tx2)}
.roles button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
.roles span.l{flex:none;align-self:center;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);font-weight:700;margin-right:2px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-size:14px;font-weight:700;color:var(--tx2);position:relative}
.tabs button[aria-selected="true"]{background:var(--ac-s);color:var(--ac)}
.bd{display:inline-block;min-width:18px;font-size:11px;line-height:18px;border-radius:9px;background:var(--bad);color:#fff;margin-left:4px;padding:0 5px;vertical-align:1px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 2px}
.sub{font-size:12px;color:var(--tx2);margin-bottom:10px;line-height:1.4}
.k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);font-weight:700}
label.f{display:block;font-size:13px;font-weight:700;color:var(--tx2);margin:10px 0 4px}
input[type=text],input[type=number],input[type=search],select{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input[type=number]{font-variant-numeric:tabular-nums}
.res{list-style:none;margin:6px 0 0;padding:0;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.res li{border-top:1px solid var(--line)}
.res li:first-child{border-top:0}
.res button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;align-items:flex-start}
.res .d{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.res .m{font-size:12px;color:var(--tx2);margin-top:2px}
.res .p{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.c-dir{background:var(--ok-s);color:var(--ok)}
.c-cot{background:var(--vio-s);color:var(--vio)}
.c-aut{background:var(--warn-s);color:var(--warn)}
.c-ped{background:var(--ac-s);color:var(--ac)}
.c-ok{background:var(--ok-s);color:var(--ok)}
.c-bad{background:var(--bad-s);color:var(--bad)}
.c-gr{background:var(--bg);color:var(--tx2);border:1px solid var(--line)}
.ln{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.ln:first-of-type{border-top:0}
.ln .a{flex:1;min-width:0}
.ln .a b{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.ln .a span{display:block;font-size:12px;color:var(--tx2);margin-top:2px}
.ln .z{text-align:right;flex:none}
.num{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.qty{width:76px!important;text-align:center;padding:8px!important}
.x{border:0;background:none;color:var(--tx3);font-size:20px;line-height:1;padding:2px 6px}
.btn{border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:800;font-size:16px;min-height:50px;width:100%}
.btn:disabled{opacity:.45}
.btn.s{min-height:40px;font-size:14px;width:auto;padding:0 14px;border-radius:10px}
.btn.ok{background:var(--ok)}
.btn.bad{background:none;border:1px solid var(--bad);color:var(--bad)}
.btn.gh{background:none;border:1px solid var(--line);color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--line);padding-top:10px;margin-top:4px;font-size:14px}
.empty{font-size:14px;color:var(--tx3);text-align:center;padding:18px 8px}
.flow{display:flex;gap:4px;margin:8px 0 2px;flex-wrap:wrap}
.flow i{font-style:normal;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--bg);color:var(--tx3);border:1px solid var(--line)}
.flow i.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.flow i.dn{background:var(--ok-s);color:var(--ok);border-color:transparent}
.grp{font-size:13px;font-weight:800;margin:14px 0 2px;display:flex;justify-content:space-between;gap:8px}
.cot{display:grid;grid-template-columns:1fr 110px auto;gap:6px;align-items:center;margin-top:6px}
.cot .win{font-size:12px}
.note{font-size:12px;color:var(--tx2);background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.4;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--tx2)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

    <div class="sub">Busca el insumo y agrégalo. Si tiene precio de menos de 6 meses se pide directo; si no, Paty lo cotiza.</div>
    <label class="f" for="q">Buscar insumo</label>
    <input type="search" id="q" placeholder="Ej. broca 1/4, guante, disco" value="${esc(busq)}" autocomplete="off">
    ${busq.trim().length>=2?`<ul class="res">${res.map(c=>{const t=vigente(catInfo(c.k));return `<li><button type="button" data-add="${c.k}"><div class="d">${esc(c.d)}<div class="m">${t?'<span class="chip c-dir">Directo</span>':'<span class="chip c-cot">A cotizar</span>'} ${esc(c.s||'Sin proveedor habitual')}</div></div><div class="p">${c.p!=null?fmt(catInfo(c.k).p):''}</div></button></li>`}).join('')}
      <li><button type="button" data-nuevo="1"><div class="d"><b>No está en el catálogo:</b> agregar “${esc(busq.trim())}” como insumo nuevo<div class="m"><span class="chip c-cot">A cotizar</span></div></div></button></li></ul>`:''}
  </div>
  <div class="card">
    <h2>Lo que vas a pedir</h2>
    ${carrito.length?lines:'<div class="empty">Aún no agregas insumos.</div>'}
    ${carrito.length?`<div class="tot"><span>Total conocido${hayCot?' (sin lo que se cotiza)':''}</span><span class="num">${fmt(tot)}</span></div>`:''}
    <div class="f" style="display:block;font-size:13px;font-weight:700;color:var(--tx2);margin:10px 0 4px">¿Para qué es?</div>
    <div class="row2">
      <button type="button" class="btn s ${paraTipo==='mo'?'':'gh'}" style="width:100%" data-para="mo" aria-pressed="${paraTipo==='mo'}">Para una MO</button>
      <button type="button" class="btn s ${paraTipo==='planta'?'':'gh'}" style="width:100%" data-para="planta" aria-pressed="${paraTipo==='planta'}">Uso planta</button>
    </div>
    ${paraTipo==='mo'?`<label class="f" for="mo">MO abierta en Katana</label><select id="mo"><option value="">Escoge la MO…</option><option value="MO-Mafesa" ${mo==='MO-Mafesa'?'selected':''}>MO-Mafesa · proyecto MAFESA (${MOS_MAFESA} MOs abiertas)</option>${MOS.map(m=>`<option value="${m.n}" ${m.n===mo?'selected':''}>${m.n} · ${esc(m.p)}${m.sku?' ('+esc(m.sku)+')':''} · ${m.st}, faltan ${nfmt(m.q)}</option>`).join('')}</select><div class="sub" style="margin:6px 0 0">MAFESA va en una sola opción; abajo, ${MOS.length} MOs abiertas de racks y otros · Katana al ${MOS_F}</div>`:''}
    ${paraTipo==='planta'?`<div class="sub" style="margin:6px 0 0">Consumo general de la planta: guantes, discos, limpieza, gases, etc.</div>`:''}
    <div style="margin-top:12px"><button class="btn" type="button" id="enviar" ${carrito.length&&paraOk()?'':'disabled'}>Enviar requisición</button></div>
    <div class="sub" style="margin-top:8px;margin-bottom:0">Folio y fecha se ponen solos. Pide: ${ROLES[ROL].n} (${ROLES[ROL].a}).</div>
  </div>`;
}
function buscar(q){
  const ws=q.toUpperCase().split(/\s+/).filter(Boolean);
  return CATALOGO.filter(c=>{const d=c.d.toUpperCase(); return ws.every(w=>d.includes(w));}).slice(0,25);
}

/* ---------- MIS REQUISICIONES / TODAS ---------- */
function reqCard(r){
  const tot=r.lines.reduce((a,l)=>a+(l.est==='rechazado'?0:imp(l)),0);
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2>${r.folio}${r.ej?' <span class="chip c-gr">Ejemplo</span>':''}</h2><span class="num">${fmt(tot)}</span></div>
  <div class="sub">${fFecha(r.fecha)} · ${ROLES[r.quien].n} (${ROLES[r.quien].a}) · ${esc(r.para)}</div>
  ${r.lines.map(l=>`<div class="ln"><div class="a"><b>${esc(l.d)}</b><span>${nfmt(l.qty)} pz · ${l.prov?esc(l.prov):'proveedor por definir'} · ${l.precio!=null?fmt(l.precio)+' c/u':'sin precio'}</span>
    ${flow(l)}</div><div class="z"><span class="chip ${EST[l.est][1]}">${EST[l.est][0]}${l.est==='parcial'?` ${l.rec}/${l.qty}`:''}</span>
    ${l.est==='autorizar'?`<div style="font-size:11px;color:var(--tx3);margin-top:4px">autoriza ${ROLES[autorizador(l)].n}</div>`:''}</div></div>`).join('')}
  </div>`;
}
function flow(l){
  if(l.est==='rechazado') return '';
  const pasos = l.tipo==='cotizar'?PASOS:PASOS.slice(1);
  const cur = l.est==='parcial'?'pedido':l.est;
  const ix = pasos.indexOf(cur);
  const nm={cotizar:'Cotizar',autorizar:'Autorizar',pedir:'Pedir',pedido:'En camino',recibido:'Recibido',facturado:'Bind'};
  return `<div class="flow">${pasos.map((p,i)=>`<i class="${i<ix||l.est==='facturado'?'dn':i===ix?'on':''}">${nm[p]}</i>`).join('')}</div>`;
}
function vMias(){ const rs=S.reqs.filter(r=>r.quien===ROL).slice().reverse(); return rs.length?rs.map(reqCard).join(''):'<div class="card empty">No has levantado requisiciones.</div>'; }
function vTodas(){
  const L=allLines(), n=e=>L.filter(x=>x.l.est===e).length;
  return `<div class="stats"><div><b>${n('cotizar')}</b><span>A cotizar</span></div><div><b>${n('autorizar')}</b><span>Por autorizar</span></div><div><b>${n('pedir')}</b><span>Por pedir</span></div>
  <div><b>${n('pedido')+n('parcial')}</b><span>En camino</span></div><div><b>${n('recibido')}</b><span>Por facturar</span></div><div><b>${n('facturado')}</b><span>En Bind</span></div></div>`
  + S.reqs.slice().reverse().map(reqCard).join('');
}

/* ---------- AUTORIZAR ---------- */
function autLine(x,quien){
  const {r,l,i}=x;
  return `<div class="ln"><div class="a"><b>${esc(l.d)}</b><span>${r.folio} · ${ROLES[r.quien].n} · ${esc(r.para)}</span><span>${nfmt(l.qty)} pz × ${fmt(l.precio)} · ${esc(l.prov||'proveedor por definir')}${l.tipo==='cotizar'?' · cotizado':''}</span>
    <div class="row" style="margin-top:8px"><button class="btn s ok" type="button" data-aut="${r.id}:${i}">Autorizar</button><button class="btn s bad" type="button" data-rech="${r.id}:${i}">Rechazar</button></div></div>
    <div class="z"><div class="num">${fmt(imp(l))}</div></div></div>`;
}
function vAutorizar(){
  const L=allLines().filter(x=>x.l.est==='autorizar'&&autorizador(x.l)==='moises');
  return `<div class="card"><h2>Por autorizar</h2><div class="sub">Conceptos de más de ${fmt(LIMITE)} (cantidad × precio). Los demás los autoriza Paty.</div>
  ${L.length?L.map(autLine).join(''):'<div class="empty">Nada pendiente.</div>'}</div>`;
}

/* ---------- PATY: PENDIENTES ---------- */
function vPend(){
  const L=allLines();
  const cot=L.filter(x=>x.l.est==='cotizar');
  const aut=L.filter(x=>x.l.est==='autorizar'&&autorizador(x.l)==='paty');
  const esp=L.filter(x=>x.l.est==='autorizar'&&autorizador(x.l)==='moises');
  const ped=L.filter(x=>x.l.est==='pedir');
  const porProv={}; ped.forEach(x=>{const p=x.l.prov||'';(porProv[p]=porProv[p]||[]).push(x);});
  const provOpts = sel => `<option value="">Proveedor…</option>`+PROVS.map(p=>`<option ${p===sel?'selected':''}>${esc(p)}</option>`).join('');
  return `
  <div class="card"><h2>1 · A cotizar <span class="chip c-cot">${cot.length}</span></h2>
    <div class="sub">Insumos nuevos o con precio vencido. Tú eliges a qué proveedores mandar y cuál gana; el precio ganador entra al catálogo.</div>
    ${cot.length?cot.map(({r,l,i})=>`<div class="ln" style="display:block"><b style="font-size:14px">${esc(l.d)}</b><div style="font-size:12px;color:var(--tx2)">${nfmt(l.qty)} pz · ${r.folio} · ${ROLES[r.quien].n} · ${esc(r.para)}</div>
      ${[0,1,2].map(j=>{const c=l.cot[j]||{prov:'',precio:null};return `<div class="cot"><select id="cp-${r.id}-${i}-${j}" data-cot="${r.id}:${i}:${j}:prov" aria-label="Proveedor ${j+1}">${provOpts(c.prov)}</select>
        <input type="number" step="0.01" inputmode="decimal" id="cv-${r.id}-${i}-${j}" placeholder="$ c/u" value="${c.precio??''}" data-cot="${r.id}:${i}:${j}:precio" aria-label="Precio ${j+1}">
        <button class="btn s gh win" type="button" data-win="${r.id}:${i}:${j}" ${c.prov&&c.precio?'':'disabled'}>Gana</button></div>`}).join('')}
      <button class="btn s gh" type="button" data-rfqtxt="${r.id}:${i}" style="margin-top:8px">Copiar solicitud de cotización</button>
      </div>`).join(''):'<div class="empty">Nada por cotizar.</div>'}
  </div>
  <div class="card"><h2>2 · Por autorizar <span class="chip c-aut">${aut.length}</span></h2>
    <div class="sub">Conceptos de hasta ${fmt(LIMITE)}. Los de más pasan a Moisés.</div>
    ${aut.length?aut.map(autLine).join(''):'<div class="empty">Nada por autorizar.</div>'}
    ${esp.length?`<div class="grp"><span>Esperando a Moisés</span><span class="chip c-aut">${esp.length}</span></div>${esp.map(({r,l})=>`<div class="ln"><div class="a"><b>${esc(l.d)}</b><span>${r.folio} · ${nfmt(l.qty)} pz</span></div><div class="z num">${fmt(imp(l))}</div></div>`).join('')}`:''}
  </div>
  <div class="card"><h2>3 · Por pedir <span class="chip c-ped">${ped.length}</span></h2>
    <div class="sub">Autorizado, agrupado por proveedor. Copia el pedido para el correo y márcalo como pedido.</div>
    ${ped.length?Object.entries(porProv).map(([p,xs])=>`<div class="grp"><span>${p?esc(p):'Sin proveedor'}</span><span class="num">${fmt(xs.reduce((a,x)=>a+imp(x.l),0))}</span></div>
      ${xs.map(({r,l,i})=>`<div class="ln"><div class="a"><b>${esc(l.d)}</b><span>${r.folio} · ${nfmt(l.qty)} pz × ${fmt(l.precio)}</span>${p?'':`<select id="ap-${r.id}-${i}" data-asig="${r.id}:${i}" style="margin-top:6px" aria-label="Asignar proveedor">${provOpts('')}</select>`}</div><div class="z num">${fmt(imp(l))}</div></div>`).join('')}
      ${p?`<div class="row" style="margin-top:6px"><button class="btn s gh" type="button" data-pedtxt="${esc(p)}">Copiar pedido</button><button class="btn s" type="button" data-pedir="${esc(p)}">Marcar como pedido</button></div>`:''}`).join(''):'<div class="empty">Nada por pedir.</div>'}
  </div>`;
}

/* ---------- ELY: RECIBIR ---------- */
function vRecibir(){
  const L=allLines().filter(x=>x.l.est==='pedido'||x.l.est==='parcial');
  const g={}; L.forEach(x=>{const p=x.l.prov||'—';(g[p]=g[p]||[]).push(x);});
  return `<div class="card"><h2>Recibir material</h2><div class="sub">Anota cuántas piezas llegaron de cada renglón. Fecha y hora se ponen solas. Si falta algo, queda abierto para que Paty lo reclame.</div>
  ${L.length?Object.entries(g).map(([p,xs])=>`<div class="grp"><span>${esc(p)}</span></div>${xs.map(({r,l,i})=>{const falta=l.qty-l.rec;return `<div class="ln"><div class="a"><b>${esc(l.d)}</b><span>${r.folio} · pedido el ${fFecha(l.pedidoF)} · pidió ${nfmt(l.qty)}${l.rec?` · ya llegaron ${nfmt(l.rec)}`:''}</span><span><b style="display:inline;color:var(--warn)">Faltan ${nfmt(falta)}</b></span></div>
    <div class="z"><input class="qty" type="number" min="0" max="${falta}" inputmode="numeric" id="rc-${r.id}-${i}" value="${falta}" aria-label="Piezas que llegaron"><div style="margin-top:6px"><button class="btn s ok" type="button" data-rec="${r.id}:${i}">Llegó</button></div></div></div>`}).join('')}`).join(''):'<div class="empty">No hay material en camino.</div>'}
  </div>`;
}

/* ---------- PATY: FACTURAS ---------- */
function vFacturas(){
  const L=allLines().filter(x=>x.l.est==='recibido');
  const g={}; L.forEach(x=>{const p=x.l.prov||'—';(g[p]=g[p]||[]).push(x);});
  return `<div class="card"><h2>Facturas · martes y viernes</h2><div class="sub">Cruce de lo pedido contra lo recibido por Ely y lo facturado. Captura el subtotal de la factura (sin IVA); solo registra en Bind lo que cuadra.</div>
  ${L.length?Object.entries(g).map(([p,xs])=>{const esp=xs.reduce((a,x)=>a+x.l.rec*(x.l.precio||0),0);const key=esc(p);return `<div class="grp"><span>${key}</span></div>
    ${xs.map(({r,l})=>`<div class="ln"><div class="a"><b>${esc(l.d)}</b><span>${r.folio} · pedido ${nfmt(l.qty)} · recibido ${nfmt(l.rec)} · ${fmt(l.precio)} c/u</span></div><div class="z num">${fmt(l.rec*(l.precio||0))}</div></div>`).join('')}
    <div class="tot"><span>Debe facturar</span><span class="num">${fmt(esp)}</span></div>
    <label class="f" for="fac-${key}">Subtotal de la factura</label>
    <div class="row"><input type="number" step="0.01" inputmode="decimal" id="fac-${key}" data-fac="${key}" data-esp="${esp}" placeholder="$" style="flex:1;min-width:0"><button class="btn s ok" type="button" data-bind="${key}" disabled>Registrado en Bind</button></div>
    <div class="sub" id="cruce-${key}" style="margin-top:6px"></div>`}).join(''):'<div class="empty">No hay material recibido por facturar.</div>'}
  </div>`;
}

/* ---------- EVENTOS ---------- */
const app=document.getElementById('app');
app.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const d=b.dataset;
  if(b.id==='reset'){ S=seed(); carrito=[]; para=''; busq=''; save(); render(); toast('Ejemplo reiniciado'); return; }
  if(d.rol){ ROL=d.rol; TAB=ROLES[ROL].tabs[0]; render(); return; }
  if(d.tab){ TAB=d.tab; render(); return; }
  if(d.add){ const c=byK[d.add]; if(!carrito.find(x=>x.k===c.k)) carrito.push({k:c.k,d:c.d,qty:1}); busq=''; render(); toast('Agregado'); return; }
  if(d.nuevo){ carrito.push({k:null,d:busq.trim().toUpperCase(),qty:1}); busq=''; render(); toast('Agregado como insumo nuevo'); return; }
  if(d.del){ carrito.splice(+d.del,1); render(); return; }
  if(d.para){ paraTipo=d.para; render(); if(paraTipo==='mo'){ const m=document.getElementById('mo'); if(m) m.focus(); } return; }
  if(b.id==='enviar'){
    S.seq++; const folio='RQ-'+String(S.seq).padStart(4,'0');
    const lines=carrito.map(x=>{ const c=x.k?catInfo(x.k):null; const dir=x.k&&vigente(c);
      return {k:x.k,d:x.d,qty:x.qty,precio:dir?c.p:null,prov:dir?c.s:null,tipo:dir?'directo':'cotizar',est:dir?'autorizar':'cotizar',cot:[],rec:0,hist:[]}; });
    S.reqs.push({id:S.seq,folio,fecha:hoyISO(),quien:ROL,para:paraTipo==='planta'?'Uso planta':mo,lines});
    carrito=[]; para=''; paraTipo=''; mo=''; save(); TAB='mias'; render(); toast(`${folio} enviada`); return;
  }
  const ref=s=>{ const [rid,i,j]=s.split(':'); const r=S.reqs.find(x=>x.id==rid); return {r,l:r.lines[+i],j:j!=null?+j:null}; };
  if(d.aut){ const {l}=ref(d.aut); l.est='pedir'; l.aut=ROLES[ROL].n; save(); render(); toast('Autorizado'); return; }
  if(d.rech){ const {l}=ref(d.rech); l.est='rechazado'; save(); render(); toast('Rechazado'); return; }
  if(d.win){ const {l,j}=ref(d.win); const c=l.cot[j]; l.precio=+c.precio; l.prov=c.prov; l.est='autorizar';
    if(l.k){ S.cat[l.k]={p:+c.precio,s:c.prov,f:hoyISO()}; }
    save(); render(); toast(`Gana ${c.prov} · pasa a autorizar (${ROLES[autorizador(l)].n})`); return; }
  if(d.rfqtxt){ const {r,l}=ref(d.rfqtxt); copiar(`Solicitud de cotización DIMACO METALMECANICA\nFolio: ${r.folio}\n\nFavor de cotizar:\n- ${nfmt(l.qty)} pz · ${l.d}\n\nIndicar precio unitario sin IVA y tiempo de entrega.\nResponder a Patricia Peña.`); return; }
  if(d.pedtxt){ const xs=allLines().filter(x=>x.l.est==='pedir'&&x.l.prov===d.pedtxt); const tot=xs.reduce((a,x)=>a+imp(x.l),0);
    copiar(`Pedido DIMACO METALMECANICA · ${d.pedtxt}\n\n`+xs.map(x=>`- ${nfmt(x.l.qty)} pz · ${x.l.d} · ${fmt(x.l.precio)} c/u = ${fmt(imp(x.l))}`).join('\n')+`\n\nSubtotal: ${fmt(tot)} + IVA\nReferencia: ${[...new Set(xs.map(x=>x.r.folio))].join(', ')}\nFacturar y enviar a Patricia Peña.`); return; }
  if(d.pedir){ allLines().filter(x=>x.l.est==='pedir'&&x.l.prov===d.pedir).forEach(x=>{x.l.est='pedido';x.l.pedidoF=hoyISO();}); save(); render(); toast(`Pedido a ${d.pedir}`); return; }
  if(d.rec){ const {r,l}=ref(d.rec); const inp=document.getElementById(`rc-${r.id}-${r.lines.indexOf(l)}`); const n=Math.max(0,Math.min(+inp.value||0,l.qty-l.rec));
    if(!n){ toast('Escribe cuántas llegaron'); return; }
    l.rec+=n; l.hist.push({f:new Date().toISOString(),n}); l.est=l.rec>=l.qty?'recibido':'parcial'; save(); render(); toast(l.est==='recibido'?'Recibido completo':`Parcial: faltan ${nfmt(l.qty-l.rec)}`); return; }
  if(d.bind){ allLines().filter(x=>x.l.est==='recibido'&&(x.l.prov||'—')===d.bind).forEach(x=>x.l.est='facturado'); save(); render(); toast('Registrado en Bind'); return; }
});
app.addEventListener('input',e=>{
  const t=e.target, d=t.dataset;
  if(t.id==='q'){ busq=t.value; const pos=t.selectionStart; render(); const q=document.getElementById('q'); q.focus(); try{q.setSelectionRange(pos,pos);}catch(_){} return; }
  if(t.id==='mo'){ mo=t.value; const en=document.getElementById('enviar'); en.disabled=!(carrito.length&&paraOk()); return; }
  if(d.qi!=null){ carrito[+d.qi].qty=Math.max(1,+t.value||1); return; }
  if(d.fac){ const v=+t.value, esp=+d.esp, out=document.getElementById('cruce-'+d.fac), bt=document.querySelector(`[data-bind="${CSS.escape(d.fac)}"]`);
    if(!t.value){ out.textContent=''; bt.disabled=true; return; }
    const dif=v-esp; const ok=Math.abs(dif)<0.5;
    out.innerHTML= ok?'<span class="chip c-ok">Cuadra</span> Se puede registrar en Bind.':`<span class="chip c-bad">No cuadra</span> La factura trae ${fmt(Math.abs(dif))} ${dif>0?'de más':'de menos'}. Revísala con el proveedor antes de registrar.`;
    bt.disabled=!ok; return; }
});
app.addEventListener('change',e=>{
  const t=e.target, d=t.dataset;
  if(d.qi!=null){ render(); return; }
  if(t.id==='mo'){ mo=t.value; render(); return; }
  if(d.cot){ const [rid,i,j,f]=d.cot.split(':'); const r=S.reqs.find(x=>x.id==rid); const l=r.lines[+i]; while(l.cot.length<3) l.cot.push({prov:'',precio:null});
    l.cot[+j][f]= f==='precio'?(t.value===''?null:+t.value):t.value; save(); render(); return; }
  if(d.asig){ const [rid,i]=d.asig.split(':'); const l=S.reqs.find(x=>x.id==rid).lines[+i]; l.prov=t.value||null; save(); render(); return; }
});
function copiar(txt){
  const ok=()=>toast('Copiado: pégalo en el correo');
  try{ navigator.clipboard.writeText(txt).then(ok,()=>mostrar(txt)); }catch(e){ mostrar(txt); }
}
function mostrar(txt){ const v=document.getElementById('view'); const n=document.createElement('div'); n.className='card'; n.innerHTML=`<h2>Texto para copiar</h2><div class="note">${esc(txt)}</div>`; v.prepend(n); window.scrollTo(0,0); }

load(); render();
</script>

</body>
</html>
