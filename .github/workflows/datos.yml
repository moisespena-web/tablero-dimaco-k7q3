name: Actualizar datos del tablero
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Traer datos de Dropbox
        env:
          DROPBOX_URL: ${{ secrets.DROPBOX_URL }}
        run: |
          URL=$(echo "$DROPBOX_URL" | sed -e 's/dl=0/dl=1/')
          case "$URL" in *dl=1*) ;; *) URL="$URL&dl=1";; esac
          curl -sSL "$URL" -o d.zip
          mkdir -p d && unzip -o -q d.zip -d d || { echo "sin zip"; exit 0; }
          F=$(find d -name 'datos-*.json' | sort | tail -1)
          [ -n "$F" ] || { echo "sin archivos"; exit 0; }
          python3 -c "import json,sys;j=json.load(open(sys.argv[1]));assert j['datos']['rows']" "$F"
          cp "$F" datos.json
          rm -rf d d.zip
          git diff --quiet -- datos.json && { echo "sin cambios"; exit 0; }
          git config user.name "Tablero DIMACO"
          git config user.email "actions@users.noreply.github.com"
          git add datos.json
          git commit -m "Datos $(basename "$F")"
          git push
