  '<div style="display:flex;gap:10px"><button type="button" '+act('codOk')+' style="flex-grow:1;min-height:56px;border-radius:12px;border:0;background:#3E8FD8;color:#fff;font-size:18px;font-weight:700">Guardar y probar</button>'+(CONX?'<button type="button" class="sec" '+act('desconectar')+'>Desconectar</button>':'')+'<button type="button" class="sec" '+act('cerrar')+'>Cerrar</button></div>';}
 return '<div class="sheet"><div class="sbox">'+h+'</div></div>';}
function vResumen(){var k=S.resDia||diaKey(Date.now()),hoy=diaKey(Date.now()),rows=S.tramos.filter(function(r){return r.d===k;}).slice();
 if(k===hoy)S.mos.forEach(function(m){var st=m.st;if(st.tramoStart)rows.push({d:k,mo:m.mo,paso:m.paso,op:OPERADOR,ini:st.tramoStart,fin:null,trab:trab(st),pausa:st.paused+(st.pauseStart?Date.now()-st.pauseStart:0),motivos:st.motivos,pz:null,vivo:st.status});});
 rows.sort(function(a,b){return a.ini-b.ini;});
 var tot={};rows.forEach(function(r){var t=tot[r.mo]=tot[r.mo]||{mo:r.mo,pz:0,trab:0,pausa:0,termino:false};t.pz+=r.pz||0;t.trab+=r.trab;t.pausa+=r.pausa;if(r.termino)t.termino=true;});
 var dias=[];S.tramos.forEach(function(r){if(dias.indexOf(r.d)<0)dias.push(r.d);});if(dias.indexOf(hoy)<0)dias.push(hoy);dias.sort();var i=dias.indexOf(k);
 var mos=Object.keys(tot).map(function(x){return tot[x];});
 return '<div class="sheet" style="align-items:stretch"><div class="sbox" style="max-height:none;height:100%;border-radius:0">'+
  '<div style="display:flex;align-items:center;gap:8px"><div class="ttl" style="flex-grow:1">📋 Resumen del turno</div><button type="button" class="sec" style="font-weight:700" '+act('cerrar')+'>✕</button></div>'+
  '<div style="display:flex;align-items:center;gap:8px"><button type="button" class="sec" '+(i>0?act('resDia',dias[i-1]):'disabled style="opacity:.3"')+'>◀</button>'+
  '<div style="flex-grow:1;text-align:center;font-size:17px;font-weight:700">'+diaTxt(k)+(k===hoy?' (hoy)':'')+'</div>'+
  '<button type="button" class="sec" '+(i<dias.length-1?act('resDia',dias[i+1]):'disabled style="opacity:.3"')+'>▶</button></div>'+
  '<button type="button" '+act('enviar')+' style="min-height:52px;border-radius:12px;border:1px solid #25C083;background:#0C3024;color:#7FE3BC;font-size:18px;font-weight:700">'+(S.copiado?'✓ Copiado':'📤 Enviar a Ing. Moisés')+'</button>'+
  '<div style="font-size:13px;color:var(--tx2)">Tiempo efectivo del día: <b style="color:var(--tx)">'+durTxt(mos.reduce(function(a,t){return a+t.trab;},0))+'</b></div>'+
  mos.map(function(t){var sp=(t.pz&&t.trab>=1000)?Math.round(t.trab/1000/t.pz):null,pl=(S.mos.filter(function(q){return q.mo===t.mo;})[0]||{}).planeado;
   return '<div class="kpi"><div style="display:flex;justify-content:space-between"><b class="mono" style="font-size:18px">'+t.mo+'</b>'+(t.termino?'<span style="font-size:12px;color:#7FE3BC;font-weight:700">TERMINADO ✓</span>':'')+'</div>'+
   '<div style="font-size:17px"><b>'+t.pz+' pz</b> · '+durTxt(t.trab)+'</div><div class="ks">'+(t.pz?(sp?sp+' s/pz real'+(pl?' · plan '+pl:''):'—'):'sin piezas')+(t.pausa?' · pausas '+durTxt(t.pausa):'')+'</div></div>';}).join('')+
  '<div class="lbl" style="margin-top:4px">LAPSOS</div>'+
  (rows.length?rows.map(function(r){return '<div class="card" style="padding:8px 10px;font-size:14px"><div style="display:flex;justify-content:space-between"><b class="mono">'+hm(r.ini)+'–'+(r.fin?hm(r.fin):'…')+'</b><b class="mono">'+r.mo+'</b><b>'+(r.pz==null?'—':r.pz+' pz')+'</b></div>'+
    '<div style="color:var(--tx2)">'+durTxt(r.trab)+' de trabajo'+(r.pausa?' · pausa '+durTxt(r.pausa)+' ('+E(r.motivos.join(', '))+')':'')+(r.vivo?' · <span style="color:#FFD37A">'+(r.vivo==='pausa'?'en pausa':'en proceso')+'</span>':(r.termino?' · Terminó':(r.motivo?' · '+E(r.motivo):'')))+'</div></div>';}).join('')
   :'<div style="color:var(--tx2);text-align:center;padding:20px">No hay lapsos registrados este día.</div>')+'</div></div>';}
function textoResumen(){var k=S.resDia||diaKey(Date.now()),rows=S.tramos.filter(function(r){return r.d===k;}),tot={},L=['RESUMEN ARMADO Y SOLDADURA 1 · '+OPERADOR+' · '+diaTxt(k)];
 rows.forEach(function(r){var t=tot[r.mo]=tot[r.mo]||{pz:0,trab:0,termino:false};t.pz+=r.pz;t.trab+=r.trab;if(r.termino)t.termino=true;});
 Object.keys(tot).forEach(function(mo){var t=tot[mo];L.push(mo+' · '+((S.mos.filter(function(q){return q.mo===mo;})[0]||{}).paso||MAQ)+' · '+t.pz+' pz · '+durTxt(t.trab)+(t.termino?' · TERMINADO':''));});
 L.push('');L.push('Lapsos:');rows.forEach(function(r){L.push(hm(r.ini)+'–'+hm(r.fin)+' '+r.mo+' · '+durTxt(r.trab)+(r.pausa?' · pausa '+durTxt(r.pausa)+' ('+r.motivos.join(', ')+')':'')+' · '+r.pz+' pz'+(r.motivo?' · '+r.motivo:''));});
 if(!rows.length)L.push('Sin lapsos terminados.');return L.join('\n');}
function render(){var y=window.scrollY,prev=S._pant;
 document.getElementById('app').innerHTML=vHeader()+vAviso()+vParada()+(S.pantalla==='lista'?vKpis()+vLista():vDetalle())+vModal();
 if(prev!==S.pantalla+'|'+S.sel){window.scrollTo(0,0);}else{window.scrollTo(0,y);}S._pant=S.pantalla+'|'+S.sel;
 document.body.style.overflow=S.modal?'hidden':'';}

/* ================================ ACCIONES ================================ */
var A={};
function upd(fn){fn(cur().st);}
A.abrir=function(v){S.pantalla='detalle';S.sel=+v;};
A.volver=function(){S.pantalla='lista';};
A.cerrar=function(){S.modal=null;S.finErr='';};
A.resumen=function(){S.modal='resumen';S.resDia=diaKey(Date.now());};
A.resDia=function(v){S.resDia=v;};
A.enviar=function(){var t=textoResumen();
 if(navigator.share){navigator.share({title:'Resumen Armado y Soldadura 1',text:t}).catch(function(){});}
 else if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){S.copiado=true;render();setTimeout(function(){S.copiado=false;render();},2500);});}};
A.verPieza=function(){S.modal='pieza';S.zoom=1;};
A.zoom=function(v){S.zoom=Math.max(1,Math.min(4,S.zoom+(+v)));};
/* START sin PIN: el teléfono es de la estación Armado y Soldadura 1 */
A.start=function(){upd(function(x){var t=Date.now();
 if(x.status==='pausa'){x.paused+=t-x.pauseStart;x.pauseStart=null;}else{x.tramoStart=t;}
 x.op=OPERADOR;x.runStart=t;x.status='prog';katEv('start',x,0);});};
A.pausa=function(){S.modal='pausa';};
A.motPausa=function(v){upd(function(x){var n=Date.now();katEv('pausa',x,n-x.runStart);x.worked+=n-x.runStart;x.runStart=null;x.pauseStart=n;x.motivos.push(v);x.status='pausa';});S.modal=null;};
A.fin=function(){S.modal='fin';S.fin='';S.finErr='';};
A.tecla=function(v){var p=v.split('|'),c=p[0],t=p[1],x=S[c];
 if(t==='⌫')x=x.slice(0,-1);else if(t==='Borrar')x='';else if(x.length<(c==='cod'?10:4))x=(c==='fin'&&x==='0'?'':x)+t;S[c]=x;S.finErr='';};
A.finOk=function(){var m=cur(),falt=Math.max(0,m.piezas-hz(m)),n=parseInt(S.fin||'0',10);
 if(n>falt){S.finErr='Solo faltan '+falt+' piezas. Revisa la cantidad.';return;}
 if(n===0){S.modal='cero';return;}
 if(n===falt){S.modal='confirma';S.pendiente=n;return;}
 upd(function(x){katEv('fin',x,x.runStart?Date.now()-x.runStart:0,n);cerrarTramo(x,n);x.status='none';x.op=null;});S.modal=null;};
A.motCero=function(v){upd(function(x){katEv('fin',x,x.runStart?Date.now()-x.runStart:0);cerrarTramo(x,0,v);x.status='none';x.op=null;});S.modal=null;};
A.confSi=function(){var n=S.pendiente;upd(function(x){katEv('completar',x,x.runStart?Date.now()-x.runStart:0,n);cerrarTramo(x,n);x.status='done';x.op=null;});if(S.tramos.length)S.tramos[S.tramos.length-1].termino=true;S.modal=null;S.pendiente=null;};
A.confNo=function(){S.modal='fin';S.pendiente=null;};
var toques=[];
A.logo=function(){var n=Date.now();toques=toques.filter(function(t){return n-t<3000;});toques.push(n);if(toques.length>=5){toques=[];S.modal='conx';S.cod='';S.conxMsg='';}};
A.codOk=function(){if(S.cod.length<6){S.conxMsg='El código tiene al menos 6 dígitos';return;}CONX={codigo:S.cod};try{localStorage.setItem('dimaco_armado1_conx',JSON.stringify(CONX));}catch(e){}
 S.conxMsg=SRV_URL?'Probando…':'Código guardado. El servidor todavía no está configurado en esta versión.';
 if(SRV_URL)api('GET','/estado').then(function(r){S.conxMsg=r.ok?'✓ Conectado a Katana':'✗ '+(r.error||'No autorizado');render();}).catch(function(){S.conxMsg='✗ Sin conexión';render();});};
A.desconectar=function(){CONX=null;try{localStorage.removeItem('dimaco_armado1_conx');}catch(e){}S.conxMsg='Teléfono desconectado.';S.sync='off';};

document.getElementById('app').addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 var f=A[b.getAttribute('data-a')];if(f){f(b.getAttribute('data-v'));render();guardar();}});

/* ============ AVISOS DE MOISÉS (app-doblez/aviso.json, cada 15 s) ============ */
var AV={d:null,visto:null,nuevo:false};try{AV.visto=localStorage.getItem('dimaco_armado1_aviso_visto');}catch(e){}
var ACX=null;function tono(f,t0,d,vol){try{ACX=ACX||new (window.AudioContext||window.webkitAudioContext)();var o=ACX.createOscillator(),g=ACX.createGain();o.type='square';o.frequency.value=f;
 g.gain.setValueAtTime(vol||0.25,ACX.currentTime+t0);g.gain.exponentialRampToValueAtTime(0.001,ACX.currentTime+t0+d);o.connect(g);g.connect(ACX.destination);o.start(ACX.currentTime+t0);o.stop(ACX.currentTime+t0+d+0.05);}catch(e){}}
function sonar(tipo){if(tipo==='parada'){for(var i=0;i<6;i++)tono(i%2?660:990,i*0.35,0.3,0.35);}else if(tipo==='alerta'){for(var j=0;j<4;j++)tono(880,j*0.3,0.22,0.3);}else{tono(880,0,0.25);tono(1175,0.3,0.4);}
 try{navigator.vibrate&&navigator.vibrate(tipo==='parada'?[400,200,400,200,400]:[300,150,300]);}catch(e){}}
function vAviso(){var d=AV.d,t=(d&&typeof d.texto==='string')?d.texto.trim():'';if(!t)return '';
 return '<div class="avi'+(d.nivel==='alerta'?' alerta':'')+(AV.nuevo?' nuevo':'')+'"><div class="al">'+(d.nivel==='alerta'?'🚨 ALERTA':'📢 AVISO')+' DE MOISÉS'+(d.actualizado?' · '+hm(Date.parse(d.actualizado)):'')+'</div><div class="at">'+E(t)+'</div></div>';}
var intAv=0;
function leerAviso(){var u=(intAv%2?'aviso.json':'https://raw.githubusercontent.com/moisespena-web/tablero-dimaco-k7q3/main/app-armado1/aviso.json')+'?t='+Date.now();
 fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
  var t=(d&&d.texto||'').trim(),clave=t?(d.actualizado||t):'';var antes=AV.d?JSON.stringify(AV.d):'';AV.d=d;
  if(t&&clave!==AV.visto){AV.visto=clave;AV.nuevo=true;try{localStorage.setItem('dimaco_armado1_aviso_visto',clave);}catch(e){}sonar(d.nivel==='alerta'?'alerta':'aviso');setTimeout(function(){AV.nuevo=false;},8000);}
  if(JSON.stringify(d)!==antes&&!S.modal)render();}).catch(function(){intAv++;});}

/* ============ ARMADO Y SOLDADURA 1 PARADO: >15 min sin START dentro del turno ============ */
/* turno 7:30-18:36 L-V; no cuentan breaks 9:00-9:15 y 15:45-16:00 ni comida 12:00-13:00 (VENTANAS/PAUSAS de arriba) */
var LIM_PARADA=15*60000, WA_URL='https://script.google.com/macros/s/AKfycbxAaapz3Qdb8ZKz65vS_4jeQJW9X_Ujaghla5cX6XFbN_NDDpWruWqbHFSPWPUnLE5v/exec';   /* WA_URL = intermediario que manda el WhatsApp a Moisés */
var PA={ult:null,ultTxt:'',ep:null,env:null};try{var pj=JSON.parse(localStorage.getItem('dimaco_armado1_parada')||'null');if(pj)PA=pj;}catch(e){}
function guardarPA(){try{localStorage.setItem('dimaco_armado1_parada',JSON.stringify(PA));}catch(e){}}
function laborable(a,b){var ms=0;if(b<=a)return 0;var d0=new Date(a);
 for(var d=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate());d<=b;d.setDate(d.getDate()+1)){var w=d.getDay();if(w===0||w===6)continue;
  VENTANAS.forEach(function(v){var x=Math.max(a,+hmD(d,v[0])),y=Math.min(b,+hmD(d,v[1]));if(y<=x)return;ms+=y-x;
   PAUSAS.forEach(function(p){var s=Math.max(x,+hmD(d,p[0])),e=Math.min(y,+hmD(d,p[1]));if(e>s)ms-=e-s;});});}
 return ms;}
function enTurno(n){return laborable(n-60000,n)>0;}
function enMarcha(){return S.mos.filter(function(m){return m.st.status==='prog';})[0]||null;}
function ultimoTxt(){var p=S.mos.filter(function(m){return m.st.status==='pausa';})[0];
 if(p)return OPERADOR+', '+p.mo+' en pausa por '+(p.st.motivos[p.st.motivos.length-1]||'sin motivo')+' desde las '+hm(p.st.pauseStart);
 var t=S.tramos[S.tramos.length-1];if(t&&diaKey(t.fin)===diaKey(Date.now()))return OPERADOR+', ultimo lapso en '+t.mo+' termino a las '+hm(t.fin)+' ('+t.pz+' pz)';
 return OPERADOR+', sin START registrado hoy en la estacion';}
function inicioParada(){var hoy=new Date(),ini=+hmD(hoy,VENTANAS[0][0]);return Math.max(PA.ult||0,ini);}
function paradaMs(){if(enMarcha())return 0;var n=Date.now();return laborable(inicioParada(),n);}
function vParada(){var ms=paradaMs();if(ms<LIM_PARADA||!enTurno(Date.now()))return '';
 return '<div class="par"><b>⛔ ARMADO Y SOLDADURA 1 PARADO · '+durTxt(ms)+'</b><div>Sin START desde las '+hm(inicioParada())+' (sin contar breaks ni comida). Presiona ▶ START en la MO que estés trabajando.'+(PA.env&&PA.env===PA.ep?' Ya se avisó a Moisés.':'')+'</div></div>';}
function enviarWA(ms){if(!WA_URL)return;var ini=inicioParada();
 var cuerpo=JSON.stringify({estacion:'Armado y Soldadura 1',tiempo:durTxt(ms)+' (desde las '+hm(ini)+')',ultimo:ultimoTxt()});
 try{fetch(WA_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:cuerpo}).catch(function(){PA.env=null;guardarPA();});}catch(e){}}
var sonoPar=0;
function vigilar(){var n=Date.now(),m=enMarcha();
 if(m){PA.ult=n;PA.ep=null;guardarPA();return;}
 var ms=paradaMs();if(ms<LIM_PARADA||!enTurno(n))return;
 var ep=diaKey(n)+'|'+inicioParada();if(PA.ep!==ep){PA.ep=ep;}
 if(PA.env!==ep){PA.env=ep;guardarPA();enviarWA(ms);sonar('parada');sonoPar=n;if(!S.modal)render();}
 else if(n-sonoPar>120000){sonoPar=n;sonar('parada');}}
/* marca el momento en que se deja de operar */
['start','motPausa','finOk','motCero','confSi'].forEach(function(k){var f=A[k];A[k]=function(v){var r=f(v);PA.ult=Date.now();guardarPA();return r;};});
/* pantalla siempre encendida mientras la app esté abierta */
var WL=null;function wake(){try{if(navigator.wakeLock&&document.visibilityState==='visible'&&!WL)navigator.wakeLock.request('screen').then(function(l){WL=l;l.addEventListener('release',function(){WL=null;});}).catch(function(){});}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){wake();leerAviso();vigilar();render();}});
document.addEventListener('click',function(){try{ACX=ACX||new (window.AudioContext||window.webkitAudioContext)();if(ACX.state==='suspended')ACX.resume();}catch(e){}wake();},true);
cargar();if(PA.ult==null){PA.ult=Date.now();guardarPA();}render();leerAviso();setInterval(leerAviso,15000);vigilar();setInterval(function(){vigilar();var p=document.querySelector('.par b');if(p)p.textContent='⛔ ARMADO Y SOLDADURA 1 PARADO · '+durTxt(paradaMs());},20000);wake();
/* logo: el mismo del tablero de TV */
fetch('../',{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){var m=t.match(/id="logo"\s+src="(data:image\/[^"]+)"/)||t.match(/src="(data:image\/png;base64,[^"]+)"/);if(m){LOGO=m[1];render();}}).catch(function(){});
setInterval(function(){var c=document.getElementById('crono'),r=document.getElementById('reloj'),e=document.getElementById('efect');
 if(r)r.textContent=hm(Date.now());if(e)e.textContent=dur(maquinaHoy());
 if(c&&S.pantalla==='detalle'){var st=cur().st;c.textContent=dur(st.tramoStart?trab(st):0);}},1000);
setInterval(function(){if(!S.modal)render();guardar();},60000);
addEventListener('pagehide',guardar);document.addEventListener('visibilitychange',guardar);
})();
