  (rows.length?rows.map(function(r){return '<tr><td class="mono" '+td+'>'+hm(r.ini)+'–'+(r.fin?hm(r.fin):'…')+'</td><td class="mono" '+td+'><b>'+r.mo+'</b></td><td '+td+'>'+E(r.op)+'</td><td '+td+'>'+durTxt(r.trab)+'</td><td '+td+'>'+(r.pausa?durTxt(r.pausa)+' <span style="color:var(--tx2)">('+E(r.motivos.join(', '))+')</span>':'—')+'</td><td '+td+'><b>'+(r.pz==null?'—':r.pz)+'</b></td><td style="padding:7px 8px;border-bottom:1px solid #1B2A3D;font-size:16px;color:var(--tx2);vertical-align:top">'+(r.vivo?'<span style="color:#FFD37A">'+(r.vivo==='pausa'?'en pausa':'en proceso')+'</span>':E(r.termino?'Terminó la operación':r.motivo))+'</td></tr>';}).join('')
   :'<tr><td colspan="7" style="padding:24px;font-size:19px;color:var(--tx2);text-align:center">No hay lapsos registrados este día.</td></tr>')+
  '</table></div></div>';}
function textoResumen(){var k=S.resDia||diaKey(Date.now()),rows=S.tramos.filter(function(r){return r.d===k;}),tot={},L=['RESUMEN TM-2P · '+diaTxt(k)];
 rows.forEach(function(r){var t=tot[r.mo]=tot[r.mo]||{paso:r.paso,pz:0,trab:0,termino:false};t.pz+=r.pz;t.trab+=r.trab;if(r.termino)t.termino=true;});
 Object.keys(tot).forEach(function(mo){var t=tot[mo];L.push(mo+' · '+t.paso+' · '+t.pz+' pz · '+durTxt(t.trab)+(t.termino?' · TERMINADA':''));});
 L.push('');L.push('Lapsos:');rows.forEach(function(r){L.push(hm(r.ini)+'–'+hm(r.fin)+' '+r.mo+' '+r.op+' · '+durTxt(r.trab)+(r.pausa?' · pausa '+durTxt(r.pausa)+' ('+r.motivos.join(', ')+')':'')+' · '+r.pz+' pz'+(r.motivo?' · '+r.motivo:''));});
 if(!rows.length)L.push('Sin lapsos terminados.');return L.join('\n');}
function render(){document.getElementById('stage').innerHTML=vHeader()+vKpis()+(S.pantalla==='lista'?vLista():vDetalle())+vModal();}

function upd(fn){fn(cur().st);}
/* ================= CONEXIÓN CON KATANA (se enciende al poner SRV_URL) =================
   Sin SRV_URL la app trabaja como hoy (modo tablet). Con SRV_URL + código de tablet:
   - la cola se lee de Katana en vivo (orden igual que la TV, vía ../datos.json)
   - START/PAUSA/FIN/COMPLETAR se mandan a Katana; si no hay red se guardan y se reenvían. */
var SRV_URL='https://dimaco-estaciones.moises-pena.workers.dev';
var CONX=null;try{CONX=JSON.parse(localStorage.getItem('dimaco_tm2p_conx')||'null');}catch(e){}
var TIPOS=[["Tipo 1",["Corte","Limpieza & SQA"],"#17A67F"],["Tipo 2",["Corte","Taladro","Limpieza & SQA"],"#3E8FD8"],["Tipo 3",["Corte","Taladro","Doblez","Limpieza & SQA"],"#7C74D6"],["Tipo 4",["Corte","CNC","Limpieza & SQA"],"#D1663C"],["Tipo 5",["Corte","CNC","Doblez","Limpieza & SQA"],"#D19A2E"]];
var MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function enLinea(){return !!(SRV_URL&&CONX&&CONX.codigo);}
function api(met,ruta,body){return fetch(SRV_URL.replace(/\/$/,'')+ruta,{method:met,headers:{'X-Tablet':CONX.codigo,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'})
 .then(function(r){return r.json().catch(function(){return {ok:false,error:'HTTP '+r.status};}).then(function(j){j._status=r.status;return j;});});}
function tipoDe(nombres){var s=nombres.slice().sort().join('|');for(var i=0;i<TIPOS.length;i++){if(TIPOS[i][1].slice().sort().join('|')===s)return [TIPOS[i][0].toUpperCase(),TIPOS[i][2]];}return ['MIXTO','#8A93A6'];}
function fechaCorta(iso){var p=iso.split('-');return (+p[2])+'-'+MES3[+p[1]-1];}
function mapaMO(k,dr,idx){var nombres=k.ruta.map(function(o){return o.nombre;}),t=tipoDe(nombres),hoy=diaKey(Date.now());
 var ent=(dr&&dr.entrega)||k.deadline||hoy,venc=!!k.deadline&&k.deadline<hoy;
 var col={'Corte':'Corte','Taladro':'Taladro','CNC':'TM-2P','Doblez':'Doblez','Limpieza & SQA':'Limpieza'};
 var ruta=['Corte','Taladro','TM-2P','Doblez','Limpieza'].map(function(c){var ops=k.ruta.filter(function(o){return col[o.nombre]===c;});
  if(!ops.length)return [c,null];return [c,ops.every(function(o){return o.status==='COMPLETED';})?'done':(ops.some(function(o){return o.status==='IN_PROGRESS';})?'prog':'none')];});
 var ing=k.ingredientes[0]||{};
 return {id:k.id,mo:k.mo,sec:idx>=0?idx+1:'–',tipo:t[0],color:t[1],nombre:k.nombre,sku:k.sku,piezas:k.piezas,hechas:k.hechas||0,entrega:fechaCorta(ent),ent:ent,
  badge:venc?'VENCIDA '+fechaCorta(k.deadline):(dr&&dr.grp==='urge'?'URGE':''),venc:venc,prio:!!(dr&&dr.grp==='urge'),paso:k.op.paso,planeado:k.op.planeado,
  rowId:k.op.rowId,katStatus:k.op.status,tiempoReal:k.op.tiempoReal,ruta:ruta,ings:k.ingredientes,ingSku:ing.sku||'',ingNombre:ing.nombre||'',ingIn:ing.total||0,ingUom:ing.uom||'',
  notas:k.notas||'Sin notas.',st:null};}
function cargarCola(){if(!enLinea())return Promise.resolve();
 return Promise.all([api('GET','/cola'),fetch('../datos.json?x='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).catch(function(){return null;}),api('GET','/operadores').catch(function(){return null;})])
 .then(function(res){var c=res[0],d=res[1],ops=res[2];
  if(!c||!c.ok){S.sync='err';S.conxMsg=(c&&c.error)||'Sin respuesta del servidor';render();return;}
  if(ops&&ops.ok&&ops.operadores.length)OPS=ops.operadores;
  var rows=(d&&d.datos&&d.datos.rows)||[],pos={};rows.forEach(function(r,i){pos[r.mo]=i;});
  var selMo=S.mos[S.sel]&&S.mos[S.sel].mo;
  S.stK=S.stK||{};S.mos.forEach(function(m){S.stK[m.mo]=m.st;});
  var lista=c.mos.map(function(k){var i=pos[k.mo]!=null?pos[k.mo]:-1,m=mapaMO(k,i>=0?rows[i]:null,i);
   m.st=Object.assign(nuevo(),S.stK[k.mo]||{});if(S.tReal[m.rowId]==null)S.tReal[m.rowId]=m.tiempoReal;return m;});
  lista.sort(function(a,b){var ia=pos[a.mo]!=null?pos[a.mo]:9999,ib=pos[b.mo]!=null?pos[b.mo]:9999;return ia-ib||(a.ent<b.ent?-1:a.ent>b.ent?1:0);});
  S.mos=lista;var ni=-1;lista.forEach(function(m,i){if(m.mo===selMo)ni=i;});
  if(ni<0){S.sel=0;if(S.pantalla==='detalle'&&!S.modal)S.pantalla='lista';}else S.sel=ni;
  S.katHora=Date.now();S.sync=S.cola.length?'pend':'ok';S.conxMsg='';if(!S.modal)render();guardar();})
 .catch(function(){S.sync='err';S.conxMsg='Sin conexión';render();});}
/* manda a la cola un evento para Katana */
function katEv(accion,x,ms,pz){if(!enLinea())return;var m=cur();if(!m.rowId)return;
 S.cola.push({rowId:m.rowId,mo:m.mo,accion:accion,operador:x.op,pin:x.pin||'',segundos:Math.round(Math.max(0,ms)/1000),piezas:pz||0,t:Date.now()});S.sync='pend';setTimeout(enviarCola,50);}
var enviando=false;
function reintentar(){if(!enLinea())return;cargarCola().then(enviarCola);}
function enviarCola(){if(!enLinea()||enviando||!S.cola.length){if(!S.cola.length&&S.sync==='pend')S.sync='ok';return;}
 enviando=true;var ev=S.cola[0],body={rowId:ev.rowId,accion:ev.accion,operador:ev.operador,pin:ev.pin,segundos:ev.segundos,piezas:ev.piezas||0,esperado:S.tReal[ev.rowId]};
 api('POST','/evento',body).then(function(r){enviando=false;
  if(r.ok){S.cola.shift();S.tReal[ev.rowId]=r.op.tiempoReal;S.mos.forEach(function(m){if(m.rowId===ev.rowId){m.katStatus=r.op.status;m.tiempoReal=r.op.tiempoReal;}});}
  else if(r._status>=400&&r._status<500){S.cola.shift();S.errores.push({t:Date.now(),mo:ev.mo,accion:ev.accion,operador:ev.operador,error:r.error||('HTTP '+r._status)});}
  else{S.sync='err';S.conxMsg=r.error||'Katana no respondió';guardar();if(!S.modal)render();setTimeout(reintentar,30000);return;}
  S.sync=S.cola.length?'pend':'ok';guardar();if(!S.modal)render();if(S.cola.length)setTimeout(enviarCola,300);else if(ev.accion==='completar')cargarCola();})
 .catch(function(){enviando=false;S.sync='err';S.conxMsg='Sin conexión';if(!S.modal)render();setTimeout(reintentar,30000);});}
function syncTxt(){if(!enLinea())return ['Modo tablet','#8FA3BA'];
 if(S.errores.length&&S.errores[S.errores.length-1].t>Date.now()-8*3600e3&&!S.errVisto)return ['⚠ '+S.errores[S.errores.length-1].mo+': '+S.errores[S.errores.length-1].error,'#FF6369'];
 return {ok:['● Katana al día','#4FE0A6'],pend:['● Enviando a Katana ('+S.cola.length+')','#FFC45C'],err:['● Sin conexión · '+S.cola.length+' por enviar','#FF6369'],off:['● Conectando…','#8FA3BA']}[S.sync]||['','#8FA3BA'];}

 S.conxMsg='Probando…';if(!SRV_URL){S.conxMsg='Código guardado. El servidor todavía no está configurado en esta versión.';return;}
 api('GET','/estado').then(function(r){S.conxMsg=r.ok?'✓ Conectado a Katana':'✗ '+(r.error||'No autorizado');render();if(r.ok)cargarCola();}).catch(function(){S.conxMsg='✗ Sin conexión con el servidor';render();});};

 if(navigator.share){navigator.share({title:'Resumen TM-2P',text:t}).catch(function(){});}
 else if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){S.copiado=true;render();setTimeout(function(){S.copiado=false;render();},2500);});}};

A.pausa=function(){S.modal='pausa';};
A.fin=function(){S.modal='fin';S.fin='';S.finErr='';};
A.op=function(v){S.opSel=v;S.pin='';S.pinErr='';};
A.tecla=function(v){var p=v.split('|'),c=p[0],t=p[1],x=S[c];
 if(t==='⌫')x=x.slice(0,-1);else if(t==='Borrar')x='';else if(x.length<(c==='cod'?10:4))x=(c==='fin'&&x==='0'?'':x)+t;S[c]=x;S.finErr='';};
A.pinOk=function(){if(S.pinChk)return;
 if(enLinea()){S.pinChk=true;S.pinErr='';api('POST','/pin',{operador:S.opSel,pin:S.pin}).then(function(r){S.pinChk=false;
   if(r._status===403){S.pinErr='PIN incorrecto. Intenta de nuevo.';S.pin='';render();return;}iniciarTramo();render();guardar();})
  .catch(function(){S.pinChk=false;iniciarTramo();render();guardar();});return;}
 iniciarTramo();};
function iniciarTramo(){var op=S.opSel,pin=S.pin;upd(function(x){var t=Date.now();
 if(x.status==='pausa'&&x.op===op){x.paused+=t-x.pauseStart;x.pauseStart=null;}
 else{if(x.tramoStart){katEv('fin',x,x.runStart?t-x.runStart:0);cerrarTramo(x,0,'cambio de operador');}x.tramoStart=t;}
 x.op=op;x.pin=pin;x.runStart=t;x.status='prog';katEv('start',x,0);});S.modal=null;S.pin='';};

A.finOk=function(){var m=cur(),falt=Math.max(0,m.piezas-hz(m)),n=parseInt(S.fin||'0',10);
 if(n>falt){S.finErr='Solo faltan '+falt+' piezas. Revisa la cantidad.';return;}
 if(n===0){S.modal='cero';return;}
 if(n===falt){S.modal='confirma';S.pendiente=n;return;}
 upd(function(x){katEv('fin',x,x.runStart?Date.now()-x.runStart:0,n);cerrarTramo(x,n);x.status='none';x.op=null;});S.modal=null;};
A.motCero=function(v){upd(function(x){katEv('fin',x,x.runStart?Date.now()-x.runStart:0);cerrarTramo(x,0,v);x.status='none';x.op=null;});S.modal=null;};

function isFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}

function goFS(){var d=document.documentElement;try{var r=d.requestFullscreen?d.requestFullscreen({navigationUI:'hide'}):d.webkitRequestFullscreen();if(r&&r.catch)r.catch(function(){});}catch(e){}}

document.addEventListener('click',function(e){if(e.target.closest('#fsBtn')){e.stopPropagation();isFS()?exitFS():goFS();}},true);

 ov.innerHTML='<div style="font-size:15px;letter-spacing:3px;color:#8FA3BA">DIMACO · ESTACIÓN</div><div style="font-size:54px;font-weight:800">TM-2P</div><div style="font-size:26px;padding:22px 44px;border-radius:18px;background:#1FA463;font-weight:700">Toca para empezar</div><div style="font-size:15px;color:#8FA3BA">Se abre en pantalla completa</div>';
