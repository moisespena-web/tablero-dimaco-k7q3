<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>TM-2P · App de piso DIMACO</title>
<style>
:root{--bg:#0A1018;--panel:#121C29;--line:#22344A;--tx:#EAF1F9;--tx2:#8FA3BA}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--tx);-webkit-tap-highlight-color:transparent;user-select:none}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed}
.mono{font-family:"SF Mono",Menlo,Consolas,monospace}
#stage{position:absolute;width:1280px;height:800px;transform-origin:0 0;display:flex;flex-direction:column;background:var(--bg)}
.hdr{display:flex;align-items:center;gap:18px;padding:10px 24px;flex:none}
#logo{height:64px;background:#fff;padding:2px 10px;border-radius:10px}
.logoTxt{background:#fff;color:#B3261E;font-weight:800;font-size:22px;padding:14px 12px;border-radius:10px}
.lbl{font-size:13px;letter-spacing:2px;color:var(--tx2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.pill{display:inline-block;color:#fff;border-radius:5px;padding:0 7px;margin-left:4px;font-weight:800}
.sku{font-weight:700;background:#1D4F7A;color:#fff;padding:1px 9px;border-radius:5px}
.fila{display:flex;align-items:center;gap:18px;width:100%;text-align:left;border-radius:14px;padding:8px 18px;min-height:88px;color:var(--tx)}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr 1.6fr;gap:12px;padding:0 24px 10px;flex:none}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 14px;position:relative;overflow:hidden}
.kv{font-size:30px;font-weight:700;line-height:1.1}
.ks{font-size:14px;color:var(--tx2)}
.modal{position:absolute;inset:0;background:rgba(5,9,14,.88);display:flex;align-items:center;justify-content:center}
.mbox{width:720px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:24px 28px;display:flex;flex-direction:column;gap:16px}
.key{min-height:60px;border-radius:10px;border:1px solid var(--line);background:#18263A;color:var(--tx);font-size:26px;font-weight:700}
.sec{min-height:64px;padding:0 24px;border-radius:12px;border:1px solid var(--line);background:#0E1723;color:var(--tx);font-size:22px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.big{border-radius:16px;border:0;font-size:32px;font-weight:800;line-height:1.3;letter-spacing:2px}
.ttl{font-size:30px;font-weight:700}
.chip{display:inline-flex;align-items:baseline;gap:6px;border-radius:8px;padding:2px 9px;font-size:15px;font-weight:700;margin:2px 6px 0 0}
</style>
</head>
<body>
<div id="stage"></div>
<script src="piezas.js"></script>

    '<div style="height:12px;background:#0E1723;border:1px solid #22344A;border-radius:8px;overflow:hidden"><div style="height:100%;background:#25C083;width:'+Math.round(100*st.done/m.piezas)+'%"></div></div>'+

   '<div class="g3" style="gap:12px;flex-grow:1;min-height:150px">'+
    '<button type="button" class="big" '+act('start')+(noStart?' disabled':'')+' style="'+bigBtn('#25C083','#07121B',!noStart)+'">▶<br>START</button>'+
    '<button type="button" class="big" '+act('pausa')+(noPausa?' disabled':'')+' style="'+bigBtn('#F2A93B','#07121B',!noPausa)+'">❚❚<br>PAUSA</button>'+
    '<button type="button" class="big" '+act('fin')+(noFin?' disabled':'')+' style="'+bigBtn('#3E8FD8','#FFFFFF',!noFin)+'">■<br>FIN</button></div></div>'+
  '<div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:10px">'+
   '<div class="card" style="padding:10px 14px"><div class="lbl" style="margin-bottom:6px">OPERACIONES DE LA MO</div><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px">'+ruta+'</div></div>'+
   '<button type="button" class="card" '+act('verPieza')+' style="flex:1 1 0;min-height:150px;padding:8px 12px;display:flex;flex-direction:column;gap:4px;color:var(--tx);text-align:left">'+
    '<div style="display:flex;justify-content:space-between;width:100%"><span class="lbl">PIEZA</span><span class="lbl">Toca para ver en grande ⤢</span></div>'+
    (img?'<div style="flex-grow:1;width:100%;min-height:0;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:6px"><img src="'+img+'" alt="Pieza '+m.sku+'" style="max-width:100%;max-height:100%;object-fit:contain"></div>':
     '<div style="flex-grow:1;width:100%;border:1px dashed #22344A;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--tx2);font-size:18px">Sin imagen para este SKU</div>')+'</button>'+
   '<div style="display:flex;gap:10px">'+
    '<div class="card" style="flex:1.3;padding:8px 14px"><div class="lbl" style="margin-bottom:4px">INGREDIENTES · solo lectura</div><div class="mono" style="font-size:18px;font-weight:700">'+E(m.ingSku)+'</div><div style="font-size:16px">'+E(m.ingNombre)+' · <b>'+Number(m.ingIn).toLocaleString('en-US',{maximumFractionDigits:3})+' in</b> (≈'+(m.ingIn/144).toFixed(1)+' barras)</div></div>'+
    '<div class="card" style="flex:1;padding:8px 14px"><div class="lbl" style="margin-bottom:4px">NOTAS</div><div style="font-size:17px;line-height:1.3">'+E(m.notas)+'</div></div></div>'+
   '<div class="card" style="padding:8px 14px;height:96px;overflow:hidden;flex:none"><div class="lbl" style="margin-bottom:4px">REGISTRO DE TRAMOS (es tu TRM)</div>'+
    (st.log.length?st.log.slice(0,3).map(function(l){return '<div style="font-size:15px;padding:2px 0;border-bottom:1px solid #1B2A3D;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+E(l)+'</div>';}).join(''):'<div style="font-size:16px;color:var(--tx2)">Todavía no hay tramos terminados en esta operación.</div>')+
   '</div></div></div></div>';}

function vModal(){if(!S.modal)return '';var m=cur(),st=m.st,falt=m.piezas-st.done,h='';
 if(S.modal==='pieza'){var img=PZ[m.sku],z=S.zoom;
  return '<div class="modal" style="flex-direction:column;gap:14px;padding:20px">'+
   '<div style="display:flex;align-items:center;gap:14px;width:100%"><span class="mono" style="font-size:30px;font-weight:700">'+m.mo+'</span><span class="mono sku" style="font-size:20px">'+m.sku+'</span><span style="flex-grow:1;font-size:22px">'+E(m.nombre)+'</span>'+
   '<button type="button" class="sec" '+act('zoom','-1')+'>−</button><span style="font-size:20px;width:60px;text-align:center">'+z+'×</span><button type="button" class="sec" '+act('zoom','1')+'>+</button>'+
   '<button type="button" class="sec" style="font-weight:700" '+act('cerrar')+'>✕ Cerrar</button></div>'+
   '<div style="flex-grow:1;width:100%;overflow:auto;background:#fff;border-radius:12px;display:flex;align-items:'+(z>1?'flex-start':'center')+';justify-content:'+(z>1?'flex-start':'center')+'">'+
   (img?'<img src="'+img+'" style="width:'+(z*100)+'%;max-width:none;'+(z===1?'max-height:100%;object-fit:contain;':'')+'">':'<div style="color:#333;font-size:22px">Sin imagen</div>')+'</div></div>';}
 if(S.modal==='pin'){var listo=!!S.opSel&&S.pin.length===4;
  h='<div class="ttl">'+(st.status==='pausa'?'¿Quién reanuda?':'¿Quién arranca?')+'</div><div class="g3">'+
   OPS.map(function(n){var on=S.opSel===n;return '<button type="button" '+act('op',n)+' style="min-height:64px;border-radius:12px;font-size:22px;font-weight:700;'+(on?'background:#0E3628;border:2px solid #25C083;color:#7FE3BC':'background:#18263A;border:1px solid #22344A;color:#EAF1F9')+'">'+E(n)+'</button>';}).join('')+'</div>'+
   (S.opSel?'<div style="display:flex;align-items:center;gap:16px"><span style="font-size:20px;color:var(--tx2)">PIN (4 dígitos)</span>'+[0,1,2,3].map(function(i){return '<span style="width:26px;height:26px;border-radius:50%;border:2px solid #8FA3BA;background:'+(i<S.pin.length?'#EAF1F9':'transparent')+'"></span>';}).join('')+'</div><div class="g6">'+teclado('pin')+'</div>':'')+
   '<div style="display:flex;gap:12px"><button type="button" '+act('pinOk')+(listo?'':' disabled')+' style="flex-grow:1;min-height:64px;border-radius:12px;border:0;background:#25C083;color:#07121B;font-size:26px;font-weight:700;opacity:'+(listo?1:.3)+'">Iniciar tramo</button><button type="button" class="sec" '+act('cerrar')+'>Cancelar</button></div>';}
 else if(S.modal==='pausa'){h='<div class="ttl">¿Por qué se pausa?</div><div class="g2">'+['Comida','Falta material','Falla de máquina','Otro'].map(function(t){return '<button type="button" '+act('motPausa',t)+' style="min-height:84px;border-radius:12px;border:2px solid #F2A93B;background:#3A2A0C;color:#FFD37A;font-size:26px;font-weight:700">'+t+'</button>';}).join('')+'</div><button type="button" class="sec" '+act('cerrar')+'>Cancelar</button>';}
 else if(S.modal==='fin'){h='<div class="ttl">¿Cuántas piezas terminaste en este tramo?</div><div style="font-size:19px;color:var(--tx2)">'+m.mo+' · '+E(m.paso)+' · TM-2P · '+E(st.op||'')+'</div>'+
  '<div style="display:flex;gap:14px;align-items:center"><div class="mono" style="flex-grow:1;font-size:54px;font-weight:700;text-align:right;background:#0A1018;border:2px solid #3E8FD8;border-radius:12px;padding:6px 18px">'+(S.fin||'0')+'</div><div style="font-size:20px;line-height:1.5">Llevas <b>'+st.done+'</b> de '+m.piezas+'<br>Faltan <b>'+falt+'</b></div></div>'+
  '<div style="min-height:26px;font-size:20px;font-weight:700;color:#FF6369">'+E(S.finErr)+'</div><div class="g6">'+teclado('fin')+'</div>'+
  '<div style="display:flex;gap:12px"><button type="button" '+act('finOk')+' style="flex-grow:1;min-height:64px;border-radius:12px;border:0;background:#3E8FD8;color:#fff;font-size:26px;font-weight:700">Guardar</button><button type="button" class="sec" '+act('cerrar')+'>Cancelar</button></div>';}
 else if(S.modal==='cero'){h='<div class="ttl">No terminaste piezas en este tramo. ¿Por qué?</div><div class="g2">'+['Se acabó el turno','Problema con la pieza','Ajuste de máquina','Otro'].map(function(t){return '<button type="button" '+act('motCero',t)+' style="min-height:84px;border-radius:12px;border:2px solid #22344A;background:#18263A;color:#EAF1F9;font-size:24px;font-weight:700">'+t+'</button>';}).join('')+'</div>';}
 else if(S.modal==='confirma'){h='<div class="ttl">¿Terminaste las '+m.piezas+' piezas?</div><div style="font-size:21px;line-height:1.4;color:#C9D6E6">La operación <b>'+E(m.paso)+'</b> de <b>'+m.mo+'</b> se marca <b style="color:#7FE3BC">TERMINADA</b> en Katana. La MO la sigue liberando Cynthia.</div>'+
  '<div style="display:flex;gap:12px"><button type="button" '+act('confSi')+' style="flex-grow:1;min-height:70px;border-radius:12px;border:0;background:#25C083;color:#07121B;font-size:26px;font-weight:700">Sí, terminé</button><button type="button" class="sec" style="flex-grow:1;min-height:70px" '+act('confNo')+'>No, corregir</button></div>';}
 return '<div class="modal"><div class="mbox">'+h+'</div></div>';}

function render(){document.getElementById('stage').innerHTML=vHeader()+vKpis()+(S.pantalla==='lista'?vLista():vDetalle())+vModal();}

function upd(fn){fn(cur().st);}
A.abrir=function(v){S.pantalla='detalle';S.sel=+v;};
A.volver=function(){S.pantalla='lista';};
A.cerrar=function(){S.modal=null;S.finErr='';};
A.verPieza=function(){S.modal='pieza';S.zoom=1;};
A.zoom=function(v){S.zoom=Math.max(1,Math.min(4,S.zoom+(+v)));};
A.start=function(){var st=cur().st;S.modal='pin';S.opSel=st.status==='pausa'?st.op:null;S.pin='';};
A.pausa=function(){S.modal='pausa';};
A.fin=function(){S.modal='fin';S.fin='';S.finErr='';};
A.op=function(v){S.opSel=v;S.pin='';};
A.tecla=function(v){var p=v.split('|'),c=p[0],t=p[1],x=S[c];
 if(t==='⌫')x=x.slice(0,-1);else if(t==='Borrar')x='';else if(x.length<4)x=(x==='0'?'':x)+t;S[c]=x;S.finErr='';};
A.pinOk=function(){var op=S.opSel;upd(function(x){var t=Date.now();
 if(x.status==='pausa'&&x.op===op){x.paused+=t-x.pauseStart;x.pauseStart=null;}
 else{if(x.tramoStart)cerrarTramo(x,0,'cambio de operador');x.tramoStart=t;}
 x.op=op;x.runStart=t;x.status='prog';});S.modal=null;S.pin='';};
A.motPausa=function(v){upd(function(x){var n=Date.now();x.worked+=n-x.runStart;x.runStart=null;x.pauseStart=n;x.motivos.push(v);x.status='pausa';});S.modal=null;};
A.finOk=function(){var m=cur(),falt=m.piezas-m.st.done,n=parseInt(S.fin||'0',10);
 if(n>falt){S.finErr='Solo faltan '+falt+' piezas. Revisa la cantidad.';return;}
 if(n===0){S.modal='cero';return;}
 if(n===falt){S.modal='confirma';S.pendiente=n;return;}
 upd(function(x){cerrarTramo(x,n);x.status='none';x.op=null;});S.modal=null;};
A.motCero=function(v){upd(function(x){cerrarTramo(x,0,v);x.status='none';x.op=null;});S.modal=null;};
A.confSi=function(){var n=S.pendiente;upd(function(x){cerrarTramo(x,n);x.status='done';x.op=null;});S.modal=null;S.pendiente=null;};
A.confNo=function(){S.modal='fin';S.pendiente=null;};

document.getElementById('stage').addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 var f=A[b.getAttribute('data-a')];if(f){f(b.getAttribute('data-v'));render();}});
function fit(){var w=innerWidth,h=innerHeight,sc=Math.min(w/1280,h/800),st=document.getElementById('stage');
 st.style.transform='scale('+sc+')';st.style.left=Math.max(0,(w-1280*sc)/2)+'px';st.style.top=Math.max(0,(h-800*sc)/2)+'px';}
function isFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function canFS(){var d=document.documentElement;return !!(d.requestFullscreen||d.webkitRequestFullscreen);}
function goFS(){var d=document.documentElement;try{var r=d.requestFullscreen?d.requestFullscreen({navigationUI:'hide'}):d.webkitRequestFullscreen();if(r&&r.catch)r.catch(function(){});}catch(e){}}
function exitFS(){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}}
var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
document.addEventListener('click',function(e){if(e.target.closest('#fsBtn')){e.stopPropagation();isFS()?exitFS():goFS();}},true);
/* en tablet: cualquier toque regresa a pantalla completa si alguien se salió */
document.addEventListener('pointerdown',function(e){if(e.pointerType==='touch'&&canFS()&&!isFS()&&!e.target.closest('#fsBtn'))goFS();},true);
['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){document.addEventListener(ev,function(){setTimeout(fit,50);render();});});
if(canFS()&&!standalone&&!isFS()){var ov=document.createElement('div');ov.id='arranque';
 ov.style.cssText='position:fixed;inset:0;z-index:9999;background:#0A101B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#EAF1F9;font-family:inherit;cursor:pointer;text-align:center;padding:24px';
 ov.innerHTML='<div style="font-size:15px;letter-spacing:3px;color:#8FA3BA">DIMACO · APP DE PISO</div><div style="font-size:54px;font-weight:800">TM-2P</div><div style="font-size:26px;padding:22px 44px;border-radius:18px;background:#1FA463;font-weight:700">Toca para empezar</div><div style="font-size:15px;color:#8FA3BA">Se abre en pantalla completa</div>';
 ov.addEventListener('click',function(){goFS();ov.remove();});document.body.appendChild(ov);}
addEventListener('resize',fit);fit();render();
/* logo: el mismo del tablero de TV (misma carpeta de GitHub Pages) */
fetch('../',{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){var m=t.match(/id="logo"\s+src="(data:image\/[^"]+)"/)||t.match(/src="(data:image\/png;base64,[^"]+)"/);if(m){LOGO=m[1];render();}}).catch(function(){});
setInterval(function(){var c=document.getElementById('crono'),r=document.getElementById('reloj'),e=document.getElementById('efect');
 if(r)r.textContent=hm(Date.now());if(e)e.textContent=dur(maquinaHoy());
 if(c){var st=cur().st;c.textContent=dur(st.tramoStart?trab(st):0);}},1000);
setInterval(function(){if(!S.modal)render();},60000);
})();
</script>
