<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>TM-2P · App de piso DIMACO</title>
<style>
:root{--bg:#0A1018;--panel:#121C29;--line:#22344A;--tx:#EAF1F9;--tx2:#8FA3BA}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--tx);-webkit-tap-highlight-color:transparent;user-select:none}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed}
.mono{font-family:"SF Mono",Menlo,Consolas,monospace}
#stage{position:absolute;width:1280px;height:800px;transform-origin:0 0;display:flex;flex-direction:column;background:var(--bg)}
.hdr{display:flex;align-items:center;gap:20px;padding:14px 24px;border-bottom:1px solid var(--line);flex:none}
.logo{background:#fff;color:#B3261E;font-weight:800;font-size:22px;letter-spacing:1px;padding:6px 12px;border-radius:8px}
.lbl{font-size:14px;letter-spacing:2px;color:var(--tx2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.pill{display:inline-block;color:#fff;border-radius:5px;padding:0 7px;margin-left:4px;font-weight:800}
.sku{font-weight:700;background:#1D4F7A;color:#fff;padding:1px 9px;border-radius:5px}
.fila{display:flex;align-items:center;gap:18px;width:100%;text-align:left;border-radius:14px;padding:10px 18px;min-height:96px;color:var(--tx)}
.modal{position:absolute;inset:0;background:rgba(5,9,14,.88);display:flex;align-items:center;justify-content:center}
.mbox{width:720px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:24px 28px;display:flex;flex-direction:column;gap:16px}
.key{min-height:60px;border-radius:10px;border:1px solid var(--line);background:#18263A;color:var(--tx);font-size:26px;font-weight:700}
.sec{min-height:64px;padding:0 24px;border-radius:12px;border:1px solid var(--line);background:#0E1723;color:var(--tx);font-size:22px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.big{border-radius:16px;border:0;font-size:34px;font-weight:800;line-height:1.3;letter-spacing:2px}
.ttl{font-size:30px;font-weight:700}
</style>
</head>
<body>
<div id="stage"></div>
<script>
(function(){
"use strict";
var now0=Date.now();
function nuevo(){return {status:'none',done:0,worked:0,runStart:null,pauseStart:null,paused:0,motivos:[],op:null,tramoStart:null,log:[]};}
var S={pantalla:'lista',sel:0,modal:null,opSel:null,pin:'',fin:'',finErr:'',pendiente:null,
mos:[
{mo:'MO-348',sec:1,tipo:'TIPO 5',color:'#D19A2E',nombre:'TERM. 1/4 x 1-1/2 x 3.625',sku:'36B4467-0029',piezas:48,entrega:'28-sep',badge:'URGE',prio:true,paso:'CNC Ø + SLT',planeado:195,
 ruta:[['Corte','done'],['Taladro',null],['TM-2P','none'],['Doblez','none'],['Limpieza','none']],ingSku:'ALSL 1/4x1 1/2',ingNombre:'Solera Aluminio 1/4" x 1 1/2"',ingIn:174,notas:'Prioridad del cliente.',st:nuevo()},
{mo:'MO-349',sec:2,tipo:'TIPO 4',color:'#D1663C',nombre:'TERM AL. 1/4 x 1-1/2 x 6',sku:'37A11432-0002',piezas:135,entrega:'28-sep',badge:'URGE',prio:true,paso:'CNC Ø + RECT',planeado:315,
 ruta:[['Corte','done'],['Taladro',null],['TM-2P','none'],['Doblez',null],['Limpieza','none']],ingSku:'ALSL 1/4x1 1/2',ingNombre:'Solera Aluminio 1/4" x 1 1/2"',ingIn:810,notas:'Prioridad del cliente.',st:nuevo()},
{mo:'MO-327',sec:19,tipo:'TIPO 4',color:'#D1663C',nombre:'TERM AL. 1/4 x 3/4 x 2.875',sku:'37A10786-0003',piezas:15,entrega:'30-sep',badge:'VENCIDA 25-sep',venc:true,prio:false,paso:'CNC Ø + RECT',planeado:315,
 ruta:[['Corte','done'],['Taladro',null],['TM-2P','none'],['Doblez',null],['Limpieza','none']],ingSku:'ALSL 1/4x3/4',ingNombre:'Solera Aluminio 1/4" x 3/4"',ingIn:43.125,notas:'Sin notas.',
 st:Object.assign(nuevo(),{status:'prog',op:'Emiliano',runStart:now0-25*60000,tramoStart:now0-25*60000})},
{mo:'MO-350',sec:20,tipo:'TIPO 5',color:'#D19A2E',nombre:'TERM AL. 1/4 x 1-1/2 x 3.625',sku:'36B3480-0011',piezas:142,entrega:'30-sep',badge:'',prio:false,paso:'CNC Ø + SLT',planeado:189,
 ruta:[['Corte','done'],['Taladro',null],['TM-2P','none'],['Doblez','none'],['Limpieza','none']],ingSku:'ALSL 1/4x1 1/2',ingNombre:'Solera Aluminio 1/4" x 1 1/2"',ingIn:514.75,notas:'Sin notas.',st:nuevo()}
]};
var OPS=['Emiliano','[Operador 2]','[Operador 3]'];
function E(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pad(n){return (n<10?'0':'')+n;}
function hm(ms){var d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes());}
function dur(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+pad(m):m)+':'+pad(x);}
function durTxt(ms){var m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m+' min';}
function cur(){return S.mos[S.sel];}
function trab(st){return st.worked+(st.runStart?Date.now()-st.runStart:0);}
function estTxt(st){return {none:'NO INICIADA',prog:'EN PROCESO · '+(st.op||''),pausa:'EN PAUSA',done:'TERMINADA ✓'}[st.status];}
function estSty(st){var c={none:['#0E1723','#3A4B62','#8FA3BA'],prog:['#3A2A0C','#8A6413','#FFD37A'],pausa:['#2A1418','#7A2A2E','#FFB3B6'],done:['#0E3628','#1B7A56','#7FE3BC']}[st.status];
 return 'display:inline-block;font-size:16px;font-weight:700;letter-spacing:1px;padding:4px 10px;border-radius:7px;background:'+c[0]+';border:1px solid '+c[1]+';color:'+c[2];}
function badge(m){if(!m.badge)return '';return '<span style="font-size:16px;font-weight:700;letter-spacing:1px;padding:3px 10px;border-radius:7px;'+(m.venc?'background:#E5484D;color:#fff':'background:#EAF1F9;color:#0A1018')+'">'+E(m.badge)+'</span>';}
function cerrarTramo(st,pz,motivo){var n=Date.now();
 if(st.runStart){st.worked+=n-st.runStart;st.runStart=null;}
 if(st.pauseStart){st.paused+=n-st.pauseStart;st.pauseStart=null;}
 var porPz=pz>0?Math.round(st.worked/1000/pz)+' s/pz':(motivo||'sin piezas');
 var pt=st.paused?' · pausa '+durTxt(st.paused)+' ('+st.motivos.join(', ')+')':'';
 st.log.unshift((st.op||'')+' · '+hm(st.tramoStart)+'–'+hm(n)+' · trabajo '+durTxt(st.worked)+pt+' · '+pz+' pz · '+porPz);
 st.done+=pz;st.worked=0;st.paused=0;st.motivos=[];st.tramoStart=null;}
var A={};  /* acciones */
function act(name,arg){return 'data-a="'+name+'"'+(arg!=null?' data-v="'+E(arg)+'"':'');}
function teclado(campo){return ['1','2','3','4','5','6','7','8','9','⌫','0','Borrar'].map(function(t){return '<button type="button" class="key" '+act('tecla',campo+'|'+t)+'>'+t+'</button>';}).join('');}

function vLista(){
 return '<div style="flex-grow:1;display:flex;flex-direction:column;gap:10px;padding:16px 24px;min-height:0">'+
 '<div style="display:flex;align-items:baseline;justify-content:space-between"><div style="font-size:18px;letter-spacing:3px;color:var(--tx2)">COLA DE LA TM-2P · MISMO ORDEN QUE LA TV</div><div style="font-size:15px;color:var(--tx2)">Toca una orden para abrirla</div></div>'+
 S.mos.map(function(m,i){var st=m.st;
  return '<button type="button" class="fila" '+act('abrir',i)+' style="background:'+(m.prio?'#2A2F3A':'#121C29')+';border:'+(m.prio?'2px solid #EAF1F9':'1px solid #22344A')+'">'+
  '<div style="width:8px;height:64px;border-radius:4px;flex:none;background:'+m.color+'"></div>'+
  '<div style="width:210px;flex:none;display:flex;flex-direction:column;gap:4px"><span class="mono" style="font-size:32px;font-weight:700">'+m.mo+'</span><span style="font-size:16px;color:var(--tx2)">#'+m.sec+' <b class="pill" style="background:'+m.color+'">'+m.tipo+'</b></span></div>'+
  '<div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px"><span style="font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">'+E(m.nombre)+'</span><span class="mono sku" style="font-size:18px">'+m.sku+'</span></div>'+
  '<div style="width:250px;flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:6px"><span style="font-size:20px">'+E(m.paso)+'</span><span style="'+estSty(st)+'">'+E(estTxt(st))+'</span></div>'+
  '<div style="width:120px;flex:none;text-align:right"><b style="font-size:30px">'+st.done+'/'+m.piezas+'</b><div style="font-size:14px;color:var(--tx2)">piezas</div></div>'+
  '<div style="width:170px;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span style="font-size:24px;font-weight:700">'+m.entrega+'</span>'+badge(m)+'</div></button>';}).join('')+
 '<div style="margin-top:auto;font-size:14px;color:var(--tx2)">MODO PRUEBA · MOs reales de Katana (26-sep). No escribe en Katana: los botones solo simulan. Recargar la página reinicia la prueba.</div></div>';}

function bigBtn(bg,fg,on){return 'background:'+bg+';color:'+fg+';opacity:'+(on?1:.25);}
function vDetalle(){var m=cur(),st=m.st,falt=m.piezas-st.done,tramo=st.tramoStart?trab(st):0;
 var noStart=!(st.status==='none'||st.status==='pausa'),noPausa=st.status!=='prog',noFin=!(st.status==='prog'||st.status==='pausa');
 var ruta=m.ruta.map(function(r){var est=r[0]==='TM-2P'?(st.status==='done'?'done':(st.status==='none'?'none':'prog')):r[1];
  if(!est)return '<div style="display:flex;align-items:center;justify-content:center;height:48px;border-radius:9px;border:1px dashed #1E2E42;color:#2C3E56;font-size:16px">'+r[0]+'</div>';
  var c={done:['#0E3628','#1B7A56','#7FE3BC','#25C083','✓'],prog:['#3A2A0C','#8A6413','#FFD37A','#F2A93B','●'],none:['#0E1723','#22344A','#8FA3BA','#3A4B62','']}[est];
  return '<div style="display:flex;align-items:center;justify-content:center;gap:7px;height:48px;border-radius:9px;font-size:16px;font-weight:700;letter-spacing:1px;background:'+c[0]+';border:'+(r[0]==='TM-2P'?'2px solid #EAF1F9':'1px solid '+c[1])+';color:'+c[2]+'"><span style="width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;color:#07121B;background:'+c[3]+'">'+c[4]+'</span>'+r[0]+'</div>';}).join('');
 var quien=st.status==='pausa'?'En pausa: '+(st.motivos[st.motivos.length-1]||''):(st.op?'Operador: '+st.op:'Sin operador');
 return '<div style="flex-grow:1;display:flex;flex-direction:column;gap:14px;padding:14px 24px 18px;min-height:0">'+
 '<div class="card" style="display:flex;align-items:center;gap:18px;border:2px solid '+(m.prio?'#EAF1F9':'#22344A')+';padding:10px 18px;flex:none">'+
  '<button type="button" class="sec" style="min-height:56px;font-size:20px" '+act('volver')+'>‹ Cola</button>'+
  '<div style="width:8px;height:60px;border-radius:4px;background:'+m.color+'"></div>'+
  '<div style="display:flex;flex-direction:column;gap:2px"><span class="mono" style="font-size:40px;font-weight:700;line-height:1">'+m.mo+'</span><span style="font-size:17px;color:var(--tx2)">#'+m.sec+' <b class="pill" style="background:'+m.color+'">'+m.tipo+'</b></span></div>'+
  '<div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span style="font-size:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">'+E(m.nombre)+'</span><span class="mono sku" style="font-size:20px">'+m.sku+'</span></div>'+
  '<div style="text-align:right"><b style="font-size:36px">'+m.piezas+'</b><span style="font-size:18px;color:var(--tx2)"> pz</span></div>'+
  '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;width:180px"><span class="lbl">ENTREGA</span><span style="font-size:28px;font-weight:700">'+m.entrega+'</span>'+badge(m)+'</div></div>'+
 '<div style="flex-grow:1;display:flex;gap:16px;min-height:0">'+
  '<div style="width:560px;flex:none;display:flex;flex-direction:column;gap:14px">'+
   '<div class="card" style="padding:16px 20px;display:flex;flex-direction:column;gap:10px">'+
    '<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="lbl">TU OPERACIÓN</span><span style="'+estSty(st)+'">'+E(estTxt(st))+'</span></div>'+
    '<div style="font-size:38px;font-weight:700;line-height:1.1">'+E(m.paso)+'</div>'+
    '<div style="font-size:20px;color:var(--tx2)">Resource: <b style="color:var(--tx)">TM-2P</b> · Planeado '+m.planeado+' s/pz</div>'+
    '<div style="display:flex;justify-content:space-between;font-size:20px;margin-top:4px"><span>Llevas <b style="font-size:26px">'+st.done+'</b> de '+m.piezas+'</span><span>Faltan <b style="font-size:26px">'+falt+'</b></span></div>'+
    '<div style="height:14px;background:#0E1723;border:1px solid #22344A;border-radius:8px;overflow:hidden"><div style="height:100%;background:#25C083;width:'+Math.round(100*st.done/m.piezas)+'%"></div></div>'+
    '<div style="display:flex;justify-content:space-between;font-size:18px;color:var(--tx2)"><span>Tramo actual: <b class="mono" id="crono" style="color:var(--tx);font-size:22px">'+dur(tramo)+'</b></span><span>'+E(quien)+'</span></div></div>'+
   '<div class="g3" style="gap:12px;flex-grow:1;min-height:180px">'+
    '<button type="button" class="big" '+act('start')+(noStart?' disabled':'')+' style="'+bigBtn('#25C083','#07121B',!noStart)+'">▶<br>START</button>'+
    '<button type="button" class="big" '+act('pausa')+(noPausa?' disabled':'')+' style="'+bigBtn('#F2A93B','#07121B',!noPausa)+'">❚❚<br>PAUSA</button>'+
    '<button type="button" class="big" '+act('fin')+(noFin?' disabled':'')+' style="'+bigBtn('#3E8FD8','#FFFFFF',!noFin)+'">■<br>FIN</button></div></div>'+
  '<div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:12px">'+
   '<div class="card" style="padding:12px 16px"><div class="lbl" style="margin-bottom:8px">OPERACIONES DE LA MO</div><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px">'+ruta+'</div></div>'+
   '<div class="card" style="padding:12px 16px"><div class="lbl" style="margin-bottom:6px">INGREDIENTES · solo lectura</div><div style="display:flex;align-items:baseline;gap:14px"><span class="mono" style="font-size:20px;font-weight:700">'+E(m.ingSku)+'</span><span style="font-size:18px;flex-grow:1">'+E(m.ingNombre)+'</span><span style="font-size:20px;font-weight:700">'+Number(m.ingIn).toLocaleString('en-US',{maximumFractionDigits:3})+' in (≈'+(m.ingIn/144).toFixed(1)+' barras)</span></div></div>'+
   '<div class="card" style="padding:12px 16px"><div class="lbl" style="margin-bottom:6px">NOTAS</div><div style="font-size:19px;line-height:1.3">'+E(m.notas)+'</div></div>'+
   '<div class="card" style="padding:12px 16px;flex-grow:1;min-height:0;overflow:hidden"><div class="lbl" style="margin-bottom:6px">REGISTRO DE TRAMOS (sale solo, es tu TRM)</div>'+
    (st.log.length?st.log.map(function(l){return '<div style="font-size:17px;padding:5px 0;border-bottom:1px solid #1B2A3D">'+E(l)+'</div>';}).join(''):'<div style="font-size:17px;color:var(--tx2)">Todavía no hay tramos terminados en esta operación.</div>')+
   '</div></div></div></div>';}

function vModal(){if(!S.modal)return '';var m=cur(),st=m.st,falt=m.piezas-st.done,h='';
 if(S.modal==='pin'){var listo=!!S.opSel&&S.pin.length===4;
  h='<div class="ttl">'+(st.status==='pausa'?'¿Quién reanuda?':'¿Quién arranca?')+'</div><div class="g3">'+

   (S.opSel?'<div style="display:flex;align-items:center;gap:16px"><span style="font-size:20px;color:var(--tx2)">PIN (4 dígitos)</span>'+[0,1,2,3].map(function(i){return '<span style="width:26px;height:26px;border-radius:50%;border:2px solid #8FA3BA;background:'+(i<S.pin.length?'#EAF1F9':'transparent')+'"></span>';}).join('')+'</div><div class="g6">'+teclado('pin')+'</div>':'')+
   '<div style="display:flex;gap:12px"><button type="button" '+act('pinOk')+(listo?'':' disabled')+' style="flex-grow:1;min-height:64px;border-radius:12px;border:0;background:#25C083;color:#07121B;font-size:26px;font-weight:700;opacity:'+(listo?1:.3)+'">Iniciar tramo</button><button type="button" class="sec" '+act('cerrar')+'>Cancelar</button></div>';}
 else if(S.modal==='pausa'){h='<div class="ttl">¿Por qué se pausa?</div><div class="g2">'+['Comida','Falta material','Falla de máquina','Otro'].map(function(t){return '<button type="button" '+act('motPausa',t)+' style="min-height:84px;border-radius:12px;border:2px solid #F2A93B;background:#3A2A0C;color:#FFD37A;font-size:26px;font-weight:700">'+t+'</button>';}).join('')+'</div><button type="button" class="sec" '+act('cerrar')+'>Cancelar</button>';}
 else if(S.modal==='fin'){h='<div class="ttl">¿Cuántas piezas terminaste en este tramo?</div><div style="font-size:19px;color:var(--tx2)">'+m.mo+' · '+E(m.paso)+' · TM-2P · '+E(st.op||'')+'</div>'+
  '<div style="display:flex;gap:14px;align-items:center"><div class="mono" style="flex-grow:1;font-size:54px;font-weight:700;text-align:right;background:#0A1018;border:2px solid #3E8FD8;border-radius:12px;padding:6px 18px">'+(S.fin||'0')+'</div><div style="font-size:20px;line-height:1.5">Llevas <b>'+st.done+'</b> de '+m.piezas+'<br>Faltan <b>'+falt+'</b></div></div>'+
  '<div style="min-height:26px;font-size:20px;font-weight:700;color:#FF6369">'+E(S.finErr)+'</div><div class="g6">'+teclado('fin')+'</div>'+
  '<div style="display:flex;gap:12px"><button type="button" '+act('finOk')+' style="flex-grow:1;min-height:64px;border-radius:12px;border:0;background:#3E8FD8;color:#fff;font-size:26px;font-weight:700">Guardar</button><button type="button" class="sec" '+act('cerrar')+'>Cancelar</button></div>';}
 else if(S.modal==='cero'){h='<div class="ttl">No terminaste piezas en este tramo. ¿Por qué?</div><div class="g2">'+['Se acabó el turno','Problema con la pieza','Ajuste de máquina','Otro'].map(function(t){return '<button type="button" '+act('motCero',t)+' style="min-height:84px;border-radius:12px;border:2px solid #22344A;background:#18263A;color:#EAF1F9;font-size:24px;font-weight:700">'+t+'</button>';}).join('')+'</div>';}
 else if(S.modal==='confirma'){h='<div class="ttl">¿Terminaste las '+m.piezas+' piezas?</div><div style="font-size:21px;line-height:1.4;color:#C9D6E6">La operación <b>'+E(m.paso)+'</b> de <b>'+m.mo+'</b> se marca <b style="color:#7FE3BC">TERMINADA</b> en Katana. La MO la sigue liberando Cynthia.</div>'+
  '<div style="display:flex;gap:12px"><button type="button" '+act('confSi')+' style="flex-grow:1;min-height:70px;border-radius:12px;border:0;background:#25C083;color:#07121B;font-size:26px;font-weight:700">Sí, terminé</button><button type="button" class="sec" style="flex-grow:1;min-height:70px" '+act('confNo')+'>No, corregir</button></div>';}
 return '<div class="modal"><div class="mbox">'+h+'</div></div>';}

function render(){var st=cur().st;
 document.getElementById('stage').innerHTML=
 '<div class="hdr"><div class="logo">DIMACO</div><div style="display:flex;flex-direction:column;flex-grow:1"><div style="font-size:28px;font-weight:700;letter-spacing:.5px">TM-2P · CNC</div><div style="font-size:15px;color:var(--tx2)">Tablet fija de la máquina · operaciones de MAFESA en orden de ataque</div></div>'+
 '<div class="card" style="display:flex;align-items:center;gap:10px;border-radius:10px;padding:8px 14px"><span class="lbl">OPERADOR</span><span style="font-size:20px;font-weight:700">'+E(S.pantalla==='detalle'&&st.op?st.op:'—')+'</span></div>'+
 '<div class="mono" id="reloj" style="font-size:40px;font-weight:300;letter-spacing:2px">'+hm(Date.now())+'</div></div>'+
 (S.pantalla==='lista'?vLista():vDetalle())+vModal();}

function upd(fn){fn(cur().st);}
A.abrir=function(v){S.pantalla='detalle';S.sel=+v;};
A.volver=function(){S.pantalla='lista';};
A.cerrar=function(){S.modal=null;S.finErr='';};
A.start=function(){var st=cur().st;S.modal='pin';S.opSel=st.status==='pausa'?st.op:null;S.pin='';};
A.pausa=function(){S.modal='pausa';};
A.fin=function(){S.modal='fin';S.fin='';S.finErr='';};
A.op=function(v){S.opSel=v;S.pin='';};
A.tecla=function(v){var p=v.split('|'),c=p[0],t=p[1],x=S[c],max=4;
 if(t==='⌫')x=x.slice(0,-1);else if(t==='Borrar')x='';else if(x.length<max)x=(x==='0'?'':x)+t;S[c]=x;S.finErr='';};
A.pinOk=function(){var op=S.opSel;upd(function(x){var t=Date.now();
 if(x.status==='pausa'&&x.op===op){x.paused+=t-x.pauseStart;x.pauseStart=null;}
 else{if(x.tramoStart)cerrarTramo(x,0,'cambio de operador');x.tramoStart=t;}
 x.op=op;x.runStart=t;x.status='prog';});S.modal=null;S.pin='';};
A.motPausa=function(v){upd(function(x){var n=Date.now();x.worked+=n-x.runStart;x.runStart=null;x.pauseStart=n;x.motivos.push(v);x.status='pausa';});S.modal=null;};
A.finOk=function(){var m=cur(),falt=m.piezas-m.st.done,n=parseInt(S.fin||'0',10);
 if(n>falt){S.finErr='Solo faltan '+falt+' piezas. Revisa la cantidad.';return;}
 if(n===0){S.modal='cero';return;}
 if(n===falt){S.modal='confirma';S.pendiente=n;return;}
 upd(function(x){cerrarTramo(x,n);x.status='none';x.op=null;});S.modal=null;};
A.motCero=function(v){upd(function(x){cerrarTramo(x,0,v);x.status='none';x.op=null;});S.modal=null;};
A.confSi=function(){var n=S.pendiente;upd(function(x){cerrarTramo(x,n);x.status='done';x.op=null;});S.modal=null;S.pendiente=null;};
A.confNo=function(){S.modal='fin';S.pendiente=null;};

document.getElementById('stage').addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 var f=A[b.getAttribute('data-a')];if(f){f(b.getAttribute('data-v'));render();}});
function fit(){var w=innerWidth,h=innerHeight,sc=Math.min(w/1280,h/800),st=document.getElementById('stage');
 st.style.transform='scale('+sc+')';st.style.left=Math.max(0,(w-1280*sc)/2)+'px';st.style.top=Math.max(0,(h-800*sc)/2)+'px';}
addEventListener('resize',fit);fit();render();
setInterval(function(){var c=document.getElementById('crono'),r=document.getElementById('reloj');
 if(r)r.textContent=hm(Date.now());if(c){var st=cur().st;c.textContent=dur(st.tramoStart?trab(st):0);}},1000);
})();
</script>
</body>
</html>
