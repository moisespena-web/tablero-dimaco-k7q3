:root{--bg:#0A1018;--panel:#121C29;--line:#22344A;--tx:#EAF1F9;--tx2:#8FA3BA;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--tx);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
button:disabled{cursor:not-allowed}
.mono{font-family:"SF Mono",Menlo,Consolas,monospace}

.hdr{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + var(--safe-t)) 0 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #16243A}
#logo,.logoTxt{height:40px;background:#fff;border-radius:8px;flex:none}
#logo{padding:2px 6px}
.logoTxt{color:#B3261E;font-weight:800;font-size:15px;padding:11px 8px}
.lbl{font-size:11px;letter-spacing:1.5px;color:var(--tx2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.pill{display:inline-block;color:#fff;border-radius:5px;padding:0 6px;font-weight:800;font-size:12px}
.sku{font-weight:700;background:#1D4F7A;color:#fff;padding:1px 7px;border-radius:5px;font-size:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 11px;position:relative;overflow:hidden}
.kv{font-size:21px;font-weight:700;line-height:1.15}
.ks{font-size:12px;color:var(--tx2)}
.chip{display:inline-block;border-radius:7px;padding:2px 7px;font-size:12px;font-weight:700;margin:3px 4px 0 0}
.fila{display:block;width:100%;text-align:left;border-radius:14px;padding:11px 12px;margin-bottom:9px;color:var(--tx)}
.st{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.5px;padding:2px 8px;border-radius:6px}
.sec{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:#0E1723;font-size:17px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(5,9,14,.82);display:flex;align-items:flex-end;justify-content:center}
.sbox{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--safe-b));display:flex;flex-direction:column;gap:12px}
.ttl{font-size:22px;font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{min-height:56px;border-radius:12px;border:1px solid var(--line);background:#18263A;font-size:24px;font-weight:700}
.acc{position:sticky;bottom:0;z-index:4;background:linear-gradient(to top,var(--bg) 78%,rgba(10,16,24,0));padding:14px 0 calc(8px + var(--safe-b));display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big{min-height:78px;border-radius:16px;border:0;font-size:19px;font-weight:800;letter-spacing:1px;line-height:1.25}
.ruta{display:flex;gap:5px;flex-wrap:wrap}
.rt{flex:1 1 0;min-width:62px;text-align:center;font-size:12px;font-weight:700;padding:7px 3px;border-radius:8px}
.avi{margin-top:8px;border-radius:12px;padding:9px 12px;background:#3A2A0C;border:2px solid #F2A93B;color:#FFE2A8}
.avi .al{font-size:11px;letter-spacing:1.5px;font-weight:800;color:#FFC45C}
.avi .at{font-size:18px;font-weight:700;line-height:1.3;margin-top:2px}
.avi.alerta{background:#3A1216;border-color:#E5484D;color:#FFD0D2}.avi.alerta .al{color:#FF8A8E}
.avi.nuevo{animation:avp 1s ease-in-out 6}
@keyframes avp{50%{box-shadow:0 0 0 6px rgba(242,169,59,.45)}}
.par{margin-top:8px;border-radius:12px;padding:10px 12px;background:#E5484D;color:#fff;animation:avp 1.2s ease-in-out infinite}
.par b{font-size:20px;letter-spacing:.5px}.par div{font-size:13px;margin-top:2px}

 for(var d=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate());d<=b;d.setDate(d.getDate()+1)){var w=d.getDay();if(w===0||w===6)continue;
  VENTANAS.forEach(function(v){var x=Math.max(a,+hmD(d,v[0])),y=Math.min(b,+hmD(d,v[1]));if(y<=x)return;ms+=y-x;
   PAUSAS.forEach(function(p){var s=Math.max(x,+hmD(d,p[0])),e=Math.min(y,+hmD(d,p[1]));if(e>s)ms-=e-s;});});}
 return ms;}
function enTurno(n){return laborable(n-60000,n)>0;}
function enMarcha(){return S.mos.filter(function(m){return m.st.status==='prog';})[0]||null;}
function ultimoTxt(){var p=S.mos.filter(function(m){return m.st.status==='pausa';})[0];
 if(p)return OPERADOR+', '+p.mo+' en pausa por '+(p.st.motivos[p.st.motivos.length-1]||'sin motivo')+' desde las '+hm(p.st.pauseStart);
 var t=S.tramos[S.tramos.length-1];if(t&&diaKey(t.fin)===diaKey(Date.now()))return OPERADOR+', ultimo lapso en '+t.mo+' termino a las '+hm(t.fin)+' ('+t.pz+' pz)';
 return OPERADOR+', sin START registrado hoy en la estacion';}
function inicioParada(){var hoy=new Date(),ini=+hmD(hoy,VENTANAS[0][0]);return Math.max(PA.ult||0,ini);}
function paradaMs(){if(enMarcha())return 0;var n=Date.now();return laborable(inicioParada(),n);}
function vParada(){var ms=paradaMs();if(ms<LIM_PARADA||!enTurno(Date.now()))return '';
 return '<div class="par"><b>⛔ LIMPIEZA PARADA · '+durTxt(ms)+'</b><div>Sin START desde las '+hm(inicioParada())+' (sin contar breaks ni comida). Presiona ▶ START en la MO que estés limpiando.'+(PA.env&&PA.env===PA.ep?' Ya se avisó a Moisés.':'')+'</div></div>';}
function enviarWA(ms){if(!WA_URL)return;var ini=inicioParada();
 var cuerpo=JSON.stringify({estacion:"Limpieza & SQA",tiempo:durTxt(ms)+' (desde las '+hm(ini)+')',ultimo:ultimoTxt()});
 try{fetch(WA_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:cuerpo}).catch(function(){PA.env=null;guardarPA();});}catch(e){}}
var sonoPar=0;
function vigilar(){var n=Date.now(),m=enMarcha();
 if(m){PA.ult=n;PA.ep=null;guardarPA();return;}
 var ms=paradaMs();if(ms<LIM_PARADA||!enTurno(n))return;
 var ep=diaKey(n)+'|'+inicioParada();if(PA.ep!==ep){PA.ep=ep;}
 if(PA.env!==ep){PA.env=ep;guardarPA();enviarWA(ms);sonar('parada');sonoPar=n;if(!S.modal)render();}
 else if(n-sonoPar>120000){sonoPar=n;sonar('parada');}}
/* marca el momento en que se deja de operar */
['start','motPausa','finOk','motCero','confSi'].forEach(function(k){var f=A[k];A[k]=function(v){var r=f(v);PA.ult=Date.now();guardarPA();return r;};});
/* pantalla siempre encendida mientras la app esté abierta */
var WL=null;function wake(){try{if(navigator.wakeLock&&document.visibilityState==='visible'&&!WL)navigator.wakeLock.request('screen').then(function(l){WL=l;l.addEventListener('release',function(){WL=null;});}).catch(function(){});}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){wake();leerAviso();vigilar();render();}});
document.addEventListener('click',function(){try{ACX=ACX||new (window.AudioContext||window.webkitAudioContext)();if(ACX.state==='suspended')ACX.resume();}catch(e){}wake();},true);
cargar();if(PA.ult==null){PA.ult=Date.now();guardarPA();}render();leerAviso();setInterval(leerAviso,15000);vigilar();setInterval(function(){vigilar();var p=document.querySelector('.par b');if(p)p.textContent='⛔ LIMPIEZA PARADA · '+durTxt(paradaMs());},20000);wake();
if(enLinea()){S.sync=S.cola.length?'pend':'off';cargarCola().then(enviarCola);}
setInterval(function(){if(enLinea()&&!S.modal){cargarCola();enviarCola();}},180000);
/* logo: el mismo del tablero de TV */
fetch('../',{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){var m=t.match(/id="logo"\s+src="(data:image\/[^"]+)"/)||t.match(/src="(data:image\/png;base64,[^"]+)"/);if(m){LOGO=m[1];render();}}).catch(function(){});
setInterval(function(){var c=document.getElementById('crono'),r=document.getElementById('reloj'),e=document.getElementById('efect');
 if(r)r.textContent=hm(Date.now());if(e)e.textContent=dur(maquinaHoy());
 if(c&&S.pantalla==='detalle'){var st=cur().st;c.textContent=dur(st.tramoStart?trab(st):0);}},1000);
setInterval(function(){if(!S.modal)render();guardar();},60000);
addEventListener('pagehide',guardar);document.addEventListener('visibilitychange',guardar);
})();
